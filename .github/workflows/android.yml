name: Build Android APK

# Manual button: Actions -> "Build Android APK" -> Run workflow
# Result: Releases page -> AI-Photo-Editor.apk  (share this file with friends)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files
        run: |
          mkdir -p cap-build/www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='api' \
            --exclude='cap-build' --exclude='node_modules' --exclude='keystore' \
            --exclude='play-store' --exclude='README.md' --exclude='cloudflare-test.html' \
            --exclude='package.json' --exclude='package-lock.json' \
            ./ cap-build/www/
          ls -la cap-build/www

      - name: Create Capacitor project
        working-directory: cap-build
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/media@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aiphotoeditor.app",
            "appName": "AI Photo Editor",
            "webDir": "www",
            "backgroundColor": "#fff0f7",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: App icon and version
        working-directory: cap-build
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open("www/icon-512.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          for name, size in sizes.items():
              folder = res + "/mipmap-" + name
              os.makedirs(folder, exist_ok=True)
              im = src.resize((size, size), Image.LANCZOS)
              im.save(folder + "/ic_launcher.png")
              im.save(folder + "/ic_launcher_round.png")
          PY
          # higher versionCode on every build, so a new APK installs over the old one
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName \"1.0.${RUN_NUMBER}\"/" android/app/build.gradle

      - name: Build and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd cap-build/android
          chmod +x gradlew
          if [ -f ../../keystore/upload.keystore.enc ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Building release APK signed with your own key (updates install over old versions)"
            ./gradlew assembleRelease --no-daemon
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in ../../keystore/upload.keystore.enc -out ../upload.keystore \
              -pass env:KEYSTORE_PASSWORD
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
              --ks ../upload.keystore --ks-key-alias upload \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out ../../AI-Photo-Editor.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
            rm ../upload.keystore
          else
            echo "No keystore found: building debug APK (friends must uninstall the old one before updating)"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../AI-Photo-Editor.apk
          fi

      - name: Save APK as download
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Editor-APK
          path: AI-Photo-Editor.apk

      - name: Publish APK on Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AI Photo Editor APK #${{ github.run_number }}
          files: AI-Photo-Editor.apk
