<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cloudflare AI Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .note {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 18px;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .preview {
      display: none;
      width: 100%;
      margin-top: 18px;
      border-radius: 14px;
    }

    .download {
      display: none;
      margin-top: 12px;
      background: #4f46e5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Cloudflare AI Test</h1>

  <div class="note">
    FLUX.2 Klein 4B image editing test.
  </div>

  <div class="card">

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <button
      id="testButton"
      type="button"
    >
      Test Cloudflare AI
    </button>

    <div
      class="status"
      id="status"
    ></div>

    <img
      id="result"
      class="preview"
      alt="Cloudflare AI Result"
    >

    <button
      id="downloadButton"
      class="download"
      type="button"
    >
      Download Result
    </button>

  </div>

</div>


<script>

const imageInput =
  document.getElementById("imageInput");

const testButton =
  document.getElementById("testButton");

const statusBox =
  document.getElementById("status");

const result =
  document.getElementById("result");

const downloadButton =
  document.getElementById("downloadButton");

let resultBlob = null;


function showStatus(text) {

  statusBox.textContent = text;

  statusBox.style.display = "block";
}


testButton.addEventListener(
  "click",
  async () => {

    const file =
      imageInput.files &&
      imageInput.files[0];

    if (!file) {

      showStatus(
        "Please select a photo first."
      );

      return;
    }


    if (!file.type.startsWith("image/")) {

      showStatus(
        "Please select an image."
      );

      return;
    }


    try {

      testButton.disabled = true;

      result.style.display = "none";

      downloadButton.style.display =
        "none";

      resultBlob = null;


      showStatus(
        "Uploading photo..."
      );


      const formData =
        new FormData();

      formData.append(
        "image",
        file
      );


      showStatus(
        "Cloudflare AI is processing..."
      );


      const response =
        await fetch(
          "/api/cloudflare-test",
          {
            method: "POST",
            body: formData
          }
        );


      if (!response.ok) {

        let errorText =
          "Cloudflare AI failed.";

        try {

          const errorData =
            await response.json();

          if (errorData.error) {

            errorText =
              errorData.error;
          }

        } catch (e) {

          const text =
            await response.text();

          if (text) {

            errorText = text;
          }
        }

        throw new Error(
          errorText
        );
      }


      resultBlob =
        await response.blob();


      const resultURL =
        URL.createObjectURL(
          resultBlob
        );


      result.src =
        resultURL;

      result.style.display =
        "block";


      downloadButton.style.display =
        "block";


      showStatus(
        "Cloudflare AI complete ✓"
      );

    }

    catch (error) {

      console.error(
        "CLOUDFLARE TEST ERROR:",
        error
      );

      showStatus(
        "Error: " +
        error.message
      );

    }

    finally {

      testButton.disabled =
        false;
    }

  }
);


downloadButton.addEventListener(
  "click",
  () => {

    if (!resultBlob) {
      return;
    }


    const url =
      URL.createObjectURL(
        resultBlob
      );


    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "cloudflare-ai-result.png";

    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      () => {
        URL.revokeObjectURL(url);
      },
      1000
    );

  }
);

</script>

</body>
