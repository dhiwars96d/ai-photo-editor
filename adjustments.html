<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjustments</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      color: #2b1d25;
      overflow: hidden;
    }

    .sheet {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* ---------- top: name, value, reset ---------- */
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 0;
    }

    .curName {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .curValue {
      min-width: 48px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #fff0f7;
      color: #c21868;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }

    .resetBtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      border: 1.5px solid #f28ab9;
      border-radius: 999px;
      background: #fff;
      color: #c21868;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .resetBtn:active { background: #fff0f7; }
    .resetBtn svg { width: 16px; height: 16px; }

    /* ---------- slider ---------- */
    .sliderWrap { padding: 16px 22px 6px; }

    #mainSlider {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 8px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 99px;
      outline: 0;
      background: #f3dce8;
      touch-action: pan-y;
      cursor: pointer;
    }
    #mainSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f42f91;
      border: 4px solid #fff;
      box-shadow: 0 2px 9px rgba(244, 47, 145, .55);
    }
    #mainSlider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f42f91;
      border: 4px solid #fff;
      box-shadow: 0 2px 9px rgba(244, 47, 145, .55);
    }

    /* ---------- tabs ---------- */
    .tabs {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px 8px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      position: relative;
      flex: 0 0 auto;
      width: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: #5d4a55;
      font-size: 13px;
      font-weight: 600;
      scroll-snap-align: center;
      cursor: pointer;
    }

    .tabIcon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #f1d2e1;
      border-radius: 50%;
      background: #fff;
      transition: background .15s, border-color .15s, color .15s;
    }
    .tabIcon svg { width: 27px; height: 27px; }

    .tab.active { color: #c21868; }
    .tab.active .tabIcon {
      background: linear-gradient(135deg, #f42f91, #ff6fb5);
      border-color: #f42f91;
      color: #fff;
      box-shadow: 0 4px 12px rgba(244, 47, 145, .35);
    }

    /* small dot when a tool has been changed */
    .tab.changed::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 20px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f42f91;
      border: 2px solid #fff;
    }
    .tab.active.changed::after { background: #fff; border-color: #f42f91; }
  </style>
</head>

<body>

  <div class="sheet">

    <div class="head">
      <span class="curName" id="curName">Brightness</span>
      <span class="curValue" id="curValue">0</span>
      <button class="resetBtn" id="resetAdjustments" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Reset
      </button>
    </div>

    <div class="sliderWrap">
      <input id="mainSlider" type="range" min="-100" max="100" value="0" step="1">
    </div>

    <div class="tabs" id="tabs"></div>

  </div>

  <script>
    const TOOLS = [
      { id: "brightness",  name: "Brightness",
        icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' },
      { id: "contrast",    name: "Contrast",
        icon: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>' },
      { id: "warmth",      name: "Warmth",
        icon: '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 1 1 1.5 2 1.5 0-3-1-5 1-7.5z"/>' },
      { id: "saturation",  name: "Saturation",
        icon: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>' },
      { id: "sharpness",   name: "Sharpness",
        icon: '<path d="M12 3l9 16H3z"/><path d="M12 10v4"/>' },
      { id: "temperature", name: "Color Temp",
        icon: '<path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/>' },
      { id: "vibrance",    name: "Vibrance",
        icon: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>' },
      { id: "tint",        name: "Tint",
        icon: '<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>' },
      { id: "shadows",     name: "Shadows",
        icon: '<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>' },
      { id: "clarity",     name: "Clarity",
        icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>' }
    ];

    const values = {};
    TOOLS.forEach(t => { values[t.id] = 0; });

    let current = TOOLS[0].id;

    const slider   = document.getElementById("mainSlider");
    const curName  = document.getElementById("curName");
    const curValue = document.getElementById("curValue");
    const tabsBox  = document.getElementById("tabs");
    const tabEls   = {};

    function sendMessage(message) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
      }
    }

    /* build tabs */
    TOOLS.forEach(tool => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab";
      btn.innerHTML =
        '<span class="tabIcon"><svg viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
        'stroke-linejoin="round">' + tool.icon + '</svg></span>' +
        '<span>' + tool.name + '</span>';
      btn.addEventListener("click", () => select(tool.id, true));
      tabsBox.appendChild(btn);
      tabEls[tool.id] = btn;
    });

    function paintSlider() {
      const min = Number(slider.min), max = Number(slider.max);
      const p = ((Number(slider.value) - min) / (max - min)) * 100;
      const a = Math.min(50, p), b = Math.max(50, p);
      slider.style.background =
        "linear-gradient(90deg, #f3dce8 0%, #f3dce8 " + a + "%, " +
        "#f42f91 " + a + "%, #f42f91 " + b + "%, " +
        "#f3dce8 " + b + "%, #f3dce8 100%)";
    }

    function refreshTabs() {
      TOOLS.forEach(t => {
        tabEls[t.id].classList.toggle("active", t.id === current);
        tabEls[t.id].classList.toggle("changed", values[t.id] !== 0);
      });
    }

    function refreshCurrent() {
      const tool = TOOLS.find(t => t.id === current);
      curName.textContent = tool.name;
      slider.value = values[current];
      curValue.textContent = values[current];
      paintSlider();
      refreshTabs();
    }

    function select(id, scroll) {
      current = id;
      refreshCurrent();
      if (scroll && tabEls[id].scrollIntoView) {
        tabEls[id].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      }
    }

    slider.addEventListener("input", () => {
      const value = Number(slider.value);
      values[current] = value;
      curValue.textContent = value;
      paintSlider();
      tabEls[current].classList.toggle("changed", value !== 0);
      sendMessage({ type: "adjustmentChange", id: current, value: value });
    });

    document.getElementById("resetAdjustments").addEventListener("click", () => {
      TOOLS.forEach(t => { values[t.id] = 0; });
      refreshCurrent();
      sendMessage({ type: "resetAdjustments" });
    });

    /* values pushed from index.html (new photo, undo, reset ...) */
    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const data = event.data || {};
      if (data.type !== "setValues" || !data.values) return;

      TOOLS.forEach(t => { values[t.id] = Number(data.values[t.id] ?? 0); });
      refreshCurrent();
    });

    refreshCurrent();
    sendMessage({ type: "adjustmentReady" });
  </script>

</body>
</html>
