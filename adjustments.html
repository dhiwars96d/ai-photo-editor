<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Photo Adjustments</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: #111827;
}

.panel {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.05);
}

.panelHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.panelTitle {
  font-size: 16px;
  font-weight: 700;
}

.resetButton {
  border: 1px solid #e5e7eb;
  background: #f9fafb;
  color: #374151;
  padding: 7px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.resetButton:active {
  transform: scale(0.96);
}

.adjustmentRow {
  margin-bottom: 15px;
}

.adjustmentRow:last-child {
  margin-bottom: 0;
}

.adjustmentLabel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
}

.adjustmentValue {
  min-width: 38px;
  text-align: right;
  color: #6b7280;
  font-size: 12px;
  font-weight: 600;
}

.slider {
  width: 100%;
  height: 5px;
  appearance: none;
  -webkit-appearance: none;
  background: #e5e7eb;
  border-radius: 10px;
  outline: none;
}

.slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #4f46e5;
  border: 3px solid white;
  box-shadow: 0 1px 5px rgba(0,0,0,0.22);
  cursor: pointer;
}

.slider::-moz-range-thumb {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #4f46e5;
  border: 3px solid white;
  box-shadow: 0 1px 5px rgba(0,0,0,0.22);
  cursor: pointer;
}

</style>

</head>

<body>

<div class="panel">

  <div class="panelHeader">

    <div class="panelTitle">
      Photo Adjustments
    </div>

    <button
      class="resetButton"
      id="resetAdjustments"
      type="button"
    >
      Reset
    </button>

  </div>


  <!-- BRIGHTNESS -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Brightness</span>

      <span
        class="adjustmentValue"
        id="brightnessValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="brightness"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- CONTRAST -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Contrast</span>

      <span
        class="adjustmentValue"
        id="contrastValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="contrast"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- WARMTH -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Warmth</span>

      <span
        class="adjustmentValue"
        id="warmthValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="warmth"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- SATURATION -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Saturation</span>

      <span
        class="adjustmentValue"
        id="saturationValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="saturation"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- SHARPNESS -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Sharpness</span>

      <span
        class="adjustmentValue"
        id="sharpnessValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="sharpness"
      type="range"
      min="0"
      max="100"
      value="0"
    >

  </div>


  <!-- COLOR TEMP -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Color Temp</span>

      <span
        class="adjustmentValue"
        id="temperatureValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="temperature"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- VIBRANCE -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Vibrance</span>

      <span
        class="adjustmentValue"
        id="vibranceValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="vibrance"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- TINT -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Tint</span>

      <span
        class="adjustmentValue"
        id="tintValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="tint"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- SHADOWS -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Shadows</span>

      <span
        class="adjustmentValue"
        id="shadowsValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="shadows"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>


  <!-- CLARITY -->

  <div class="adjustmentRow">

    <div class="adjustmentLabel">

      <span>Clarity</span>

      <span
        class="adjustmentValue"
        id="clarityValue"
      >
        0
      </span>

    </div>

    <input
      class="slider"
      id="clarity"
      type="range"
      min="-100"
      max="100"
      value="0"
    >

  </div>

</div>


<script>

const adjustmentIds = [
  "brightness",
  "contrast",
  "warmth",
  "saturation",
  "sharpness",
  "temperature",
  "vibrance",
  "tint",
  "shadows",
  "clarity"
];


const sliders = {};
const values = {};


adjustmentIds.forEach(
  (id) => {

    sliders[id] =
      document.getElementById(id);

    values[id] =
      document.getElementById(
        id + "Value"
      );

  }
);


/* SEND SLIDER VALUE */

function sendChange(id) {

  window.parent.postMessage(
    {
      type: "adjustment-change",
      id: id,
      value: Number(
        sliders[id].value
      )
    },
    "*"
  );

}


/* SLIDER EVENTS */

adjustmentIds.forEach(
  (id) => {

    sliders[id].addEventListener(
      "input",
      () => {

        values[id].textContent =
          sliders[id].value;

        sendChange(id);

      }
    );

  }
);


/* RESET */

document
  .getElementById(
    "resetAdjustments"
  )
  .addEventListener(
    "click",
    () => {

      adjustmentIds.forEach(
        (id) => {

          sliders[id].value =
            0;

          values[id].textContent =
            "0";

        }
      );


      window.parent.postMessage(
        {
          type: "reset-adjustments"
        },
        "*"
      );

    }
  );


/* RECEIVE VALUES FROM MAIN PAGE */

window.addEventListener(
  "message",
  (event) => {

    const data =
      event.data || {};


    if (
      data.type !==
      "set-adjustment-state"
    ) {
      return;
    }


    const incoming =
      data.values || {};


    adjustmentIds.forEach(
      (id) => {

        if (
          typeof incoming[id] !==
          "undefined"
        ) {

          sliders[id].value =
            incoming[id];

          values[id].textContent =
            incoming[id];

        }

      }
    );

  }
);


/* TELL MAIN PAGE WE ARE READY */

window.parent.postMessage(
  {
    type: "adjustments-ready"
  },
  "*"
);

</script>

</body>

</html>
