<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adjustments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .adjustmentsCard {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
    }

    .adjustmentTitle {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #111827;
    }

    .control {
      margin-bottom: 17px;
    }

    .control:last-of-type {
      margin-bottom: 14px;
    }

    .controlTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .controlName {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .controlValue {
      min-width: 38px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      margin: 0;
      padding: 0;
      accent-color: #6366f1;
      cursor: pointer;
    }

    .resetButton {
      width: 100%;
      margin-top: 4px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .resetButton:active {
      transform: scale(0.99);
    }

    @media (max-width: 380px) {
      .adjustmentsCard {
        padding: 14px;
      }

      .control {
        margin-bottom: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="adjustmentsCard">

    <div class="adjustmentTitle">
      Photo Adjustments
    </div>

    <!-- Brightness -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Brightness</span>
        <span class="controlValue" id="brightnessValue">0</span>
      </div>
      <input id="brightness" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Contrast -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Contrast</span>
        <span class="controlValue" id="contrastValue">0</span>
      </div>
      <input id="contrast" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Warmth -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Warmth</span>
        <span class="controlValue" id="warmthValue">0</span>
      </div>
      <input id="warmth" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Saturation -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Saturation</span>
        <span class="controlValue" id="saturationValue">0</span>
      </div>
      <input id="saturation" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Sharpness -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Sharpness</span>
        <span class="controlValue" id="sharpnessValue">0</span>
      </div>
      <input id="sharpness" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Color Temp -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Color Temp</span>
        <span class="controlValue" id="temperatureValue">0</span>
      </div>
      <input id="temperature" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Vibrance -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Vibrance</span>
        <span class="controlValue" id="vibranceValue">0</span>
      </div>
      <input id="vibrance" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Tint -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Tint</span>
        <span class="controlValue" id="tintValue">0</span>
      </div>
      <input id="tint" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Shadows -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Shadows</span>
        <span class="controlValue" id="shadowsValue">0</span>
      </div>
      <input id="shadows" type="range" min="-100" max="100" value="0">
    </div>

    <!-- Clarity -->
    <div class="control">
      <div class="controlTop">
        <span class="controlName">Clarity</span>
        <span class="controlValue" id="clarityValue">0</span>
      </div>
      <input id="clarity" type="range" min="-100" max="100" value="0">
    </div>

    <button class="resetButton" id="resetAdjustments">
      Reset Adjustments
    </button>

  </div>

  <script>
    const adjustmentIds = [
      "brightness",
      "contrast",
      "warmth",
      "saturation",
      "sharpness",
      "temperature",
      "vibrance",
      "tint",
      "shadows",
      "clarity"
    ];

    const values = {};

    function sendMessage(message) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          message,
          window.location.origin
        );
      }
    }

    adjustmentIds.forEach(id => {

      const slider = document.getElementById(id);
      const valueElement = document.getElementById(id + "Value");

      values[id] = 0;

      slider.addEventListener("input", () => {

        const value = Number(slider.value);

        values[id] = value;

        valueElement.textContent = value;

        sendMessage({
          type: "adjustmentChange",
          id: id,
          value: value
        });

      });

    });


    document
      .getElementById("resetAdjustments")
      .addEventListener("click", () => {

        adjustmentIds.forEach(id => {

          const slider = document.getElementById(id);
          const valueElement =
            document.getElementById(id + "Value");

          slider.value = 0;
          valueElement.textContent = "0";

          values[id] = 0;

        });

        sendMessage({
          type: "resetAdjustments"
        });

      });


    window.addEventListener("message", event => {

      if (event.source !== window.parent) {
        return;
      }

      const data = event.data || {};

      if (
        data.type !== "setValues" ||
        !data.values
      ) {
        return;
      }

      adjustmentIds.forEach(id => {

        const slider = document.getElementById(id);
        const valueElement =
          document.getElementById(id + "Value");

        const value =
          Number(data.values[id] ?? 0);

        slider.value = value;
        valueElement.textContent = value;

        values[id] = value;

      });

    });


    // Tell index.html that this file is ready
    sendMessage({
      type: "adjustmentReady"
    });

  </script>

</body>
</html>
