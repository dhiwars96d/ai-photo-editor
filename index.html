<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Editor</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }

        #options {
            margin-top: 15px;
        }

        .optionButton {
            margin: 4px;
            padding: 8px 14px;
            font-size: 16px;
        }

        #editButton {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>AI Photo Editor</h1>

    <p>Apni photo select karein:</p>

    <input type="file" id="photoInput" accept="image/*">

    <br>
<img id="preview" alt="Photo Preview">
    <canvas id="maskCanvas" style="display:none;"></canvas>

    <br>

    <div id="options">

        <button class="optionButton" data-option="enhance">
            ✨ Enhance
        </button>

        <button class="optionButton" data-option="smooth">
            🧴 Smooth Skin
        </button>

        <button class="optionButton" data-option="smile">
            😊 Smile
        </button>

        <button class="optionButton" data-option="hair">
            💇 Hair Color
        </button>

    </div>

    <br>

    <button id="editButton">AI Edit</button>

    <p id="status"></p>

    <script>

        const photoInput = document.getElementById("photoInput");
        const preview = document.getElementById("preview");
        const editButton = document.getElementById("editButton");
        const status = document.getElementById("status");

        let selectedFile = null;

        let selectedOption = "enhance";


        /* OPTION BUTTONS */

        document.querySelectorAll(".optionButton").forEach(function(button) {

            button.addEventListener("click", function() {

                selectedOption = button.dataset.option;

                status.textContent =
                    "Selected: " + button.textContent.trim();

            });

        });


        /* PHOTO SELECT */

        photoInput.addEventListener("change", function() {

            selectedFile = photoInput.files[0];

            if (selectedFile) {

                preview.src = URL.createObjectURL(selectedFile);

                preview.style.display = "block";

                status.textContent = "Photo ready hai.";

            }

        });


        /* AI EDIT */

        editButton.addEventListener("click", async function() {

            alert("AI Edit button working");

            if (!selectedFile) {

                status.textContent =
                    "Pehle photo select karein.";

                return;
            }

            status.textContent =
                "AI photo edit kar raha hai...";

            editButton.disabled = true;


            try {

                const formData = new FormData();

                formData.append("image", selectedFile);


                /* DEFAULT ENHANCE PROMPT */

                let editPrompt =
                    "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";


                /* ENHANCE */

                if (selectedOption === "enhance") {

                    editPrompt =
                        "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";

                }


                /* SMOOTH SKIN */

                else if (selectedOption === "smooth") {

                    editPrompt =
                        "Retouch the person's facial skin professionally. Clearly smooth the skin and reduce acne, pimples, blemishes, dark spots, uneven skin texture and fine lines. Make the skin look clean, soft, fresh and naturally polished while preserving realistic skin texture. Keep the exact same person, face shape, eyes, nose, lips, hairstyle and identity unchanged. Do not change facial features. Do not make the skin plastic, blurry or overly airbrushed. Only improve the skin."

                }


                /* SMILE - ABHI BAAD ME */

                else if (selectedOption === "smile") {

                    editPrompt =
                        "Create a subtle natural smile while preserving the exact original face and identity. Change only the mouth expression. Do not change the eyes, nose, cheeks, jawline, face shape, skin, hair or hairstyle."

                }


                /* HAIR COLOR - ABHI BAAD ME */

                else if (selectedOption === "hair") {

                    editPrompt =
                        "Keep the person's identity and face unchanged. Naturally improve and enhance the hair appearance while keeping the original hairstyle.";

                }


                formData.append("prompt", editPrompt);
if (selectedOption === "smile") {
    const maskCanvas = document.getElementById("maskCanvas");

    if (maskCanvas) {
        const maskData = maskCanvas.toDataURL("image/png");
        formData.append("mask", maskData);
    }
}

                const response = await fetch("/api/edit", {

                    method: "POST",

                    body: formData

                });


                const dataType =
                    response.headers.get("content-type") || "";


                if (!response.ok) {

                    let message = "AI editing failed";


                    if (dataType.includes("application/json")) {

                        const error =
                            await response.json();

                        message =
                            error.details ||
                            error.error ||
                            message;

                    }

                    else {

                        message =
                            await response.text();

                    }


                    throw new Error(message);

                }


                const blob =
                    await response.blob();


                preview.src =
                    URL.createObjectURL(blob);

                preview.style.display =
                    "block";


                status.textContent =
                    "AI Edit complete!";


            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Error: " + error.message;

            }


            editButton.disabled = false;

        });

    </script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script>
const faceMesh = new FaceMesh({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.3,
  minTrackingConfidence: 0.3
});

faceMesh.onResults((results) => {
  if (results.multiFaceLandmarks &&
      results.multiFaceLandmarks.length > 0) {
const landmarks = results.multiFaceLandmarks[0];

// Mouth के मुख्य landmarks
const leftMouth = landmarks[61];
const rightMouth = landmarks[291];
const topMouth = landmarks[13];
const bottomMouth = landmarks[14];
const canvas = document.getElementById("maskCanvas");
const ctx = canvas.getContext("2d");

const img = document.getElementById("preview");

canvas.width = img.naturalWidth;
canvas.height = img.naturalHeight;

ctx.clearRect(0, 0, canvas.width, canvas.height);

// Sirf mouth area ka chhota mask

const x1 = Math.min(leftMouth.x, rightMouth.x) * canvas.width;
const x2 = Math.max(leftMouth.x, rightMouth.x) * canvas.width;

const y1 = Math.min(topMouth.y, bottomMouth.y) * canvas.height;
const y2 = Math.max(topMouth.y, bottomMouth.y) * canvas.height;

const mouthWidth = x2 - x1;
const mouthHeight = y2 - y1;

// Bahut kam extra area
const paddingX = mouthWidth * 0.25;
const paddingY = mouthHeight * 0.8;

ctx.fillStyle = "white";

ctx.fillRect(
  Math.max(0, x1 - paddingX),
  Math.max(0, y1 - paddingY),
  Math.min(canvas.width, mouthWidth + paddingX * 2),
  Math.min(canvas.height, mouthHeight + paddingY * 2)
);

const maskImage = canvas.toDataURL("image/png");
console.log("Mouth mask created:", maskImage);
console.log("Mouth detected:", {
  left: leftMouth,
  right: rightMouth,
  top: topMouth,
  bottom: bottomMouth
});
    document.getElementById("status").textContent =
      "Face detected ✅";

  } else {

    document.getElementById("status").textContent =
      "Face not detected ❌";
  }
});

document.getElementById("preview").addEventListener("load", async () => {
  try {
    await faceMesh.send({
      image: document.getElementById("preview")
    });
  } catch (error) {
    console.error(error);
  }
});
    </script>
</body>
</html>
