<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #17171c;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    /* HEADER */

    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      background: #eeeaff;
      color: #6547d9;
      padding: 7px 11px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* TITLE */

    .title {
      margin: 0;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 9px 0 22px;
      color: #777780;
      font-size: 14px;
      line-height: 1.5;
    }

    /* PHOTO AREA */

    .photo-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e7e7ec;
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.05);
    }

    .photo-box {
      width: 100%;
      height: 300px;
      border-radius: 17px;
      background: #f0f1f5;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-box img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f0f1f5;
    }

    .empty-photo {
      text-align: center;
      color: #9999a2;
      font-size: 14px;
    }

    .empty-photo-title {
      color: #55555e;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    /* ADD PHOTO */

    .add-photo {
      width: 100%;
      margin-top: 11px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: #17171c;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-photo:active {
      transform: scale(0.99);
    }

    #fileInput {
      display: none;
    }

    /* TOOLS */

    .section-title {
      margin: 25px 0 11px;
      font-size: 16px;
      font-weight: 700;
    }

    .tools {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .tool {
      min-width: 0;
      height: 122px;
      padding: 12px 7px;
      border: 1px solid #e2e2e8;
      border-radius: 18px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tool:hover {
      border-color: #8d73e8;
    }

    .tool.active {
      background: #6846d9;
      border-color: #6846d9;
      color: white;
    }

    .toolIcon {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
      margin-bottom: 7px;
    }
    .tool[data-tool="hair"] .toolIcon {
  width: 58px;
  height: 58px;
    }
    .tool.active .toolIcon {
      filter: brightness(0) invert(1);
    }

    .tool-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* APPLY BUTTON */

    .apply-btn {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 16px;
      background: #6846d9;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(104,70,217,0.22);
    }

    .apply-btn:disabled {
      background: #c9c6d4;
      box-shadow: none;
      cursor: not-allowed;
    }

    .apply-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* STATUS */

    .status {
      width: 100%;
      min-height: 20px;
      margin-top: 13px;
      text-align: center;
      color: #777780;
      font-size: 13px;
      line-height: 1.4;
    }

    /* SMALL MOBILE */

    @media (max-width: 380px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .title {
        font-size: 27px;
      }

      .photo-box {
        height: 270px;
      }

      .tool {
        height: 118px;
      }

      .toolIcon {
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="brand">AI Photo Editor</div>
      <div class="badge">AI Powered</div>
    </header>

    <h1 class="title">Make your photos better.</h1>

    <p class="subtitle">
      Choose a photo and select an AI editing tool.
    </p>

    <section class="photo-card">

      <div class="photo-box">

        <div class="empty-photo" id="emptyPhoto">
          <div class="empty-photo-title">No photo selected</div>
          <div>Choose a photo to get started</div>
        </div>

        <img id="preview" alt="Photo Preview">

      </div>

      <button class="add-photo" id="addPhotoBtn">
        + Add Photo
      </button>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
      >

    </section>

    <div class="section-title">
      Choose an edit
    </div>

    <div class="tools">

      <div class="tool active" data-tool="enhance">

        <img
          class="toolIcon"
          src="./enhance-icon.png"
          alt="Enhance"
        >

        <div class="tool-name">
          Enhance
        </div>

      </div>

      <div class="tool" data-tool="smooth">

        <img
          class="toolIcon"
          src="./smooth-icon.png"
          alt="Smooth Skin"
        >

        <div class="tool-name">
          Smooth Skin
        </div>

      </div>

      <div class="tool" data-tool="hair">

        <img
          class="toolIcon"
          src="./hair-icon.png"
          alt="Hair"
        >

        <div class="tool-name">
          Hair
        </div>

      </div>

    </div>

    <button
      class="apply-btn"
      id="applyBtn"
      disabled
    >
      ✨ Apply AI Edit
    </button>

    <div class="status" id="status"></div>

  </div>


  <script>

    const fileInput = document.getElementById("fileInput");
    const addPhotoBtn = document.getElementById("addPhotoBtn");
    const preview = document.getElementById("preview");
    const emptyPhoto = document.getElementById("emptyPhoto");
    const applyBtn = document.getElementById("applyBtn");
    const status = document.getElementById("status");

    const tools = document.querySelectorAll(".tool");

    let selectedTool = "enhance";
    let selectedFile = null;


    /* ADD PHOTO */

    addPhotoBtn.addEventListener("click", function () {
      fileInput.click();
    });


    /* PHOTO SELECT */

    fileInput.addEventListener("change", function () {

      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      selectedFile = file;

      const imageURL = URL.createObjectURL(file);

      preview.src = imageURL;
      preview.style.display = "block";
      emptyPhoto.style.display = "none";

      applyBtn.disabled = false;

      status.textContent = "Photo ready";
    });


    /* TOOL SELECT */

    tools.forEach(function (tool) {

      tool.addEventListener("click", function () {

        tools.forEach(function (item) {
          item.classList.remove("active");
        });

        tool.classList.add("active");

        selectedTool = tool.dataset.tool;

        status.textContent = "";

      });

    });


    /* AI EDIT */

    applyBtn.addEventListener("click", async function () {

      if (!selectedFile) {
        status.textContent = "Please select a photo first.";
        return;
      }

      let prompt = "";

      if (selectedTool === "enhance") {

        prompt =
          "Enhance this photo naturally. Improve overall image quality, sharpness, lighting and details. Preserve the exact same person, face identity, facial features, skin texture and hairstyle. Do not change the person's identity.";

      }

      if (selectedTool === "smooth") {

        prompt =
          "Smooth the skin naturally. Reduce minor blemishes and uneven skin texture while keeping realistic skin pores and facial details. Preserve the exact same person, identity, eyes, nose, mouth, face shape, jawline and hairstyle. Do not change the face.";

      }

      if (selectedTool === "hair") {

        prompt =
          "Improve and enhance the person's hair naturally. Keep the exact same person and face identity. Preserve the face, eyes, nose, mouth, skin, face shape and hairstyle structure. Make only a subtle natural improvement to the hair.";

      }


      applyBtn.disabled = true;
      status.textContent = "AI photo edit kar raha hai...";


      try {

        const formData = new FormData();

        formData.append("image", selectedFile);
        formData.append("prompt", prompt);


        const response = await fetch("/api/edit", {
  method: "POST",
  body: formData
});

console.log("API STATUS:", response.status);
console.log("API TYPE:", response.headers.get("content-type"));

if (!response.ok) {

  const errorText = await response.text();

  throw new Error(
    "Server Error (" +
    response.status +
    "): " +
    errorText
  );
}


        const contentType = response.headers.get("content-type");

if (!contentType || !contentType.startsWith("image/")) {
  const errorText = await response.text();

  throw new Error(
    "Server returned: " + errorText
  );
}

const resultBlob = await response.blob();

        const resultURL = URL.createObjectURL(resultBlob);

        preview.src = resultURL;
        preview.style.display = "block";
        emptyPhoto.style.display = "none";

        status.textContent = "AI Edit complete!";


      } catch (error) {

        console.error(error);

        status.textContent =
          error.message || "AI edit failed.";

      }


      applyBtn.disabled = false;

    });

  </script>

</body>
</html>
