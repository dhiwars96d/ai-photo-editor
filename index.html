<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Photo Editor</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#f5f5f5;
}
h1{margin:10px 0}
#preview{
  display:none;
  max-width:100%;
  max-height:60vh;
  margin:15px auto;
  border-radius:10px;
}
#options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:15px 0;
}
.optionButton,#editButton{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-size:15px;
  cursor:pointer;
}
.optionButton{background:#ddd}
.optionButton.active{background:#222;color:white}
#editButton{
  background:#007bff;
  color:white;
  width:90%;
  max-width:350px;
}
#status{
  min-height:24px;
  font-size:14px;
  margin-top:15px;
}
canvas{display:none}
</style>
</head>

<body>

<h1>AI Photo Editor</h1>
<p>Apni photo select karein:</p>

<input type="file" id="photoInput" accept="image/*">

<img id="preview" alt="Photo Preview">

<canvas id="workCanvas"></canvas>
<canvas id="maskCanvas"></canvas>

<div id="options">
  <button class="optionButton active" data-option="enhance">✨ Enhance</button>
  <button class="optionButton" data-option="smooth">🧴 Smooth Skin</button>
  <button class="optionButton" data-option="smile">😊 Smile</button>
  <button class="optionButton" data-option="hair">💇 Hair Color</button>
</div>

<button id="editButton">AI Edit</button>

<p id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
const photoInput=document.getElementById("photoInput");
const preview=document.getElementById("preview");
const workCanvas=document.getElementById("workCanvas");
const maskCanvas=document.getElementById("maskCanvas");
const editButton=document.getElementById("editButton");
const status=document.getElementById("status");
const buttons=document.querySelectorAll(".optionButton");

let selectedFile=null;
let selectedOption="enhance";
let landmarks=null;

buttons.forEach(button=>{
  button.onclick=()=>{
    buttons.forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    selectedOption=button.dataset.option;
    status.textContent="Selected: "+button.textContent;
  };
});

photoInput.onchange=()=>{
  const file=photoInput.files[0];
  if(!file)return;

  selectedFile=file;
  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
  status.textContent="Photo ready hai.";

  if(selectedOption==="smile"){
    setTimeout(detectFace,500);
  }
};

const faceMesh=new FaceMesh({
  locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true,
  minDetectionConfidence:.3,
  minTrackingConfidence:.3
});

faceMesh.onResults(results=>{
  if(results.multiFaceLandmarks &&
     results.multiFaceLandmarks.length){

    landmarks=results.multiFaceLandmarks[0];
    status.textContent="Face detected ✓";
  }else{
    landmarks=null;
    status.textContent="Face not detected";
  }
});

async function detectFace(){
  if(!preview.complete)return;

  try{
    await faceMesh.send({image:preview});
  }catch(e){
    console.log(e);
    landmarks=null;
    status.textContent="Face detection error";
  }
}

preview.onload=()=>{
  if(selectedOption==="smile")detectFace();
};

function point(index,w,h){
  return {
    x:landmarks[index].x*w,
    y:landmarks[index].y*h
  };
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function sample(ctx,x,y,w,h){
  x=clamp(x,0,w-1);
  y=clamp(y,0,h-1);

  const x0=Math.floor(x);
  const y0=Math.floor(y);
  const x1=Math.min(x0+1,w-1);
  const y1=Math.min(y0+1,h-1);

  const fx=x-x0;
  const fy=y-y0;

  const a=ctx.getImageData(x0,y0,1,1).data;
  const b=ctx.getImageData(x1,y0,1,1).data;
  const c=ctx.getImageData(x0,y1,1,1).data;
  const d=ctx.getImageData(x1,y1,1,1).data;

  return [
    a[0]*(1-fx)*(1-fy)+b[0]*fx*(1-fy)+
    c[0]*(1-fx)*fy+d[0]*fx*fy,

    a[1]*(1-fx)*(1-fy)+b[1]*fx*(1-fy)+
    c[1]*(1-fx)*fy+d[1]*fx*fy,

    a[2]*(1-fx)*(1-fy)+b[2]*fx*(1-fy)+
    c[2]*(1-fx)*fy+d[2]*fx*fy
  ];
}

function makeSmile(){

  if(!landmarks){
    status.textContent="Pehle face detect hona zaroori hai.";
    return false;
  }

  const w=preview.naturalWidth;
  const h=preview.naturalHeight;

  workCanvas.width=w;
  workCanvas.height=h;

  maskCanvas.width=w;
  maskCanvas.height=h;

  const src=workCanvas.getContext("2d");
  const out=workCanvas.getContext("2d");
  const mask=maskCanvas.getContext("2d");

  src.clearRect(0,0,w,h);
  src.drawImage(preview,0,0,w,h);

  const left=point(61,w,h);
  const right=point(291,w,h);
  const upper=point(13,w,h);
  const lower=point(14,w,h);

  const mouthWidth=Math.abs(right.x-left.x);
  const mouthHeight=Math.abs(lower.y-upper.y);

  const padX=mouthWidth*.9;
  const padY=Math.max(mouthHeight*4,40);

  const x0=Math.max(0,Math.floor(left.x-padX));
  const y0=Math.max(0,Math.floor(upper.y-padY));
  const x1=Math.min(w,Math.ceil(right.x+padX));
  const y1=Math.min(h,Math.ceil(lower.y+padY));

  const cw=x1-x0;
  const ch=y1-y0;

  const temp=document.createElement("canvas");
  temp.width=cw;
  temp.height=ch;

  const tc=temp.getContext("2d");
  tc.drawImage(preview,x0,y0,cw,ch);

  const original=tc.getImageData(0,0,cw,ch);
  const result=tc.createImageData(cw,ch);

  const lift=clamp(mouthWidth*.055,5,14);

  const centerX=(left.x+right.x)/2-x0;
  const centerY=(upper.y+lower.y)/2-y0;

  for(let y=0;y<ch;y++){

    for(let x=0;x<cw;x++){

      const nx=(x-centerX)/(mouthWidth*.9);
      const ny=(y-centerY)/(mouthHeight*3.5);

      const dist=Math.sqrt(nx*nx+ny*ny);

      let influence=0;

      if(dist<1){
        const corner=Math.abs(nx);
        influence=(1-dist)*Math.pow(corner,1.5);
      }

      const sourceX=x;
      const sourceY=y+lift*influence;

      const sx=clamp(Math.floor(sourceX),0,cw-1);
      const sy=clamp(Math.floor(sourceY),0,ch-1);

      const si=(sy*cw+sx)*4;
      const di=(y*cw+x)*4;

      result.data[di]=original.data[si];
      result.data[di+1]=original.data[si+1];
      result.data[di+2]=original.data[si+2];
      result.data[di+3]=original.data[si+3];
    }
  }

  tc.putImageData(result,0,0);

  out.clearRect(0,0,w,h);
  out.drawImage(preview,0,0,w,h);
  out.drawImage(temp,x0,y0);

  mask.clearRect(0,0,w,h);

  const gradient=mask.createRadialGradient(
    centerX+x0,
    centerY+y0,
    mouthWidth*.2,
    centerX+x0,
    centerY+y0,
    mouthWidth*.9
  );

  gradient.addColorStop(0,"white");
  gradient.addColorStop(.65,"rgba(255,255,255,.7)");
  gradient.addColorStop(1,"transparent");

  mask.fillStyle=gradient;
  mask.fillRect(x0,y0,cw,ch);

  preview.src=workCanvas.toDataURL("image/jpeg",.95);

  status.textContent="Smile effect applied ✓";

  return true;
}

async function aiEdit(){

  if(!selectedFile){
    status.textContent="Pehle photo select karein.";
    return;
  }

  if(selectedOption==="smile"){
    makeSmile();
    return;
  }

  status.textContent="AI photo edit kar raha hai...";
  editButton.disabled=true;

  try{

    const formData=new FormData();
    formData.append("image",selectedFile);

    let prompt="";

    if(selectedOption==="enhance"){
      prompt=
      "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";
    }

    if(selectedOption==="smooth"){
      prompt=
      "Retouch the person's facial skin professionally. Clearly smooth the skin and reduce acne, pimples, blemishes, dark spots, uneven skin texture and fine lines. Make the skin clean, soft, fresh and naturally polished while preserving realistic skin texture. Keep the exact same person, face shape, eyes, nose, lips, hairstyle and identity unchanged. Do not change facial features. Do not make the skin plastic, blurry or overly airbrushed. Only improve the skin.";
    }

    if(selectedOption==="hair"){
      prompt=
      "Keep the person's identity and face unchanged. Naturally improve and enhance the hair appearance while keeping the original hairstyle.";
    }

    formData.append("prompt",prompt);

    const response=await fetch("/api/edit",{
      method:"POST",
      body:formData
    });

    if(!response.ok){
      throw new Error("Server error");
    }

    const blob=await response.blob();

    preview.onload=null;
    preview.src=URL.createObjectURL(blob);
    preview.style.display="block";

    status.textContent="AI Edit complete ✓";

  }catch(error){

    console.error(error);
    status.textContent="AI Edit failed.";

  }finally{

    editButton.disabled=false;
  }
}

editButton.onclick=aiEdit;
</script>

</body>
</html>
