<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Editor</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            margin-top: 20px;
            display: none;
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>AI Photo Editor</h1>

    <p>Apni photo select karein:</p>

    <input type="file" id="photoInput" accept="image/*">

    <br>

    <img id="preview">

    <br>

    <button id="editButton">AI Edit</button>

    <p id="status"></p>

    <script>
        const photoInput = document.getElementById("photoInput");
        const preview = document.getElementById("preview");
        const editButton = document.getElementById("editButton");
        const status = document.getElementById("status");

        let selectedFile = null;

        photoInput.addEventListener("change", function () {
            selectedFile = this.files[0];

            if (selectedFile) {
                preview.src = URL.createObjectURL(selectedFile);
                preview.style.display = "block";
                status.textContent = "Photo ready hai.";
            }
        });

        editButton.addEventListener("click", async function () {
          alert("AI Edit button working");
            if (!selectedFile) {
                status.textContent = "Pehle photo select karein.";
                return;
            }

            status.textContent = "AI photo edit kar raha hai...";
            alert("AI Edit button working");
            editButton.disabled = true;

            try {
                const formData = new FormData();

                formData.append("image", selectedFile);
                formData.append(
                    "prompt",
                    "Improve this photo naturally, smooth skin slightly, enhance facial details, keep the person's identity and face unchanged."
                );

                const response = await fetch("/api/edit", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(
    error.details || error.error || "AI editing failed"
);

                const blob = await response.blob();

                preview.src = URL.createObjectURL(blob);
                preview.style.display = "block";

                status.textContent = "AI Edit complete!";

            } catch (error) {
                console.error(error);
                status.textContent = "Error: " + error.message;
            }

            editButton.disabled = false;
        });
    </script>

</body>
</html>
