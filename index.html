<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Photo Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #111827;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 22px 16px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
    }

    .badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      font-size: 34px;
      line-height: 1.12;
      margin: 0 0 12px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .photoCard {
      background: white;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .previewBox {
      width: 100%;
      min-height: 280px;
      background: #f1f3f7;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #preview {
      display: none;
      width: 100%;
      height: auto;
      max-height: 560px;
      object-fit: contain;
      border-radius: 17px;
    }

    .placeholder {
      text-align: center;
      color: #9ca3af;
      padding: 40px 20px;
    }

    .placeholderIcon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .addButton {
      width: 100%;
      border: 0;
      background: #111827;
      color: white;
      padding: 14px;
      border-radius: 14px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .addButton:active {
      transform: scale(0.98);
    }

    #fileInput {
      display: none;
    }

    .sectionTitle {
      font-size: 16px;
      font-weight: 700;
      margin: 24px 0 12px;
    }

    .tools {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .tool {
      flex: 1;
      min-width: 0;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      padding: 13px 8px;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }

    .tool:active {
      transform: scale(0.97);
    }

    .tool.active {
      border-color: #6366f1;
      background: #f5f3ff;
    }

    .toolIcon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    .tool[data-tool="hair"] .toolIcon {
      width: 58px;
      height: 58px;
      margin-top: -5px;
      margin-bottom: 3px;
    }

    .toolName {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .status {
      display: none;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 13px;
      padding: 13px;
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .downloadButton {
      display: none;
      width: 100%;
      border: 0;
      background: #16a34a;
      color: white;
      padding: 14px;
      border-radius: 14px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .downloadButton:active {
      transform: scale(0.98);
    }

    .smallNote {
      color: #9ca3af;
      font-size: 11px;
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 29px;
      }

      .tools {
        gap: 7px;
      }

      .tool {
        padding: 11px 5px;
      }

      .toolIcon {
        width: 43px;
        height: 43px;
      }

      .tool[data-tool="hair"] .toolIcon {
        width: 53px;
        height: 53px;
      }

      .toolName {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">AI Photo Editor</div>
    <div class="badge">AI Powered</div>
  </header>

  <h1>Make your photos better.</h1>

  <div class="subtitle">
    Enhance your photos and improve skin appearance with simple AI-powered tools.
  </div>

  <div class="photoCard">

    <div class="previewBox">

      <div class="placeholder" id="placeholder">
        <div class="placeholderIcon">📷</div>
        <div>Select a photo to get started</div>
      </div>

      <img id="preview" alt="Photo Preview">

    </div>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
    >

    <button class="addButton" id="addPhoto">
      Add Photo
    </button>

  </div>

  <div class="sectionTitle">
    AI Tools
  </div>

  <div class="tools">

    <div class="tool" data-tool="enhance">

      <img
        class="toolIcon"
        src="enhance-icon.png"
        alt="Enhance"
      >

      <div class="toolName">
        Enhance
      </div>

    </div>

    <div class="tool" data-tool="smooth">

      <img
        class="toolIcon"
        src="smooth-icon.png"
        alt="Smooth Skin"
      >

      <div class="toolName">
        Smooth Skin
      </div>

    </div>

    <div class="tool" data-tool="hair">

      <img
        class="toolIcon"
        src="hair-icon.png"
        alt="Hair"
      >

      <div class="toolName">
        Hair
      </div>

    </div>

  </div>

  <div class="status" id="status"></div>

  <button class="downloadButton" id="downloadButton">
    Download Edited Photo
  </button>

  <div class="smallNote">
    Your photo is processed only when you select an editing tool.
  </div>

</div>


<script type="module">

import {
  Client,
  handle_file
} from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";


/* =========================================================
   BASIC ELEMENTS
========================================================= */

const fileInput = document.getElementById("fileInput");
const addPhoto = document.getElementById("addPhoto");
const preview = document.getElementById("preview");
const placeholder = document.getElementById("placeholder");
const statusBox = document.getElementById("status");
const downloadButton = document.getElementById("downloadButton");

let selectedFile = null;
let editedBlob = null;


/* =========================================================
   ADD PHOTO
========================================================= */

addPhoto.addEventListener("click", () => {
  fileInput.click();
});


fileInput.addEventListener("change", () => {

  const file = fileInput.files[0];

  if (!file) {
    return;
  }

  selectedFile = file;
  editedBlob = null;

  const url = URL.createObjectURL(file);

  preview.src = url;
  preview.style.display = "block";
  placeholder.style.display = "none";

  downloadButton.style.display = "none";

  statusBox.style.display = "none";

});


/* =========================================================
   STATUS
========================================================= */

function showStatus(text) {

  statusBox.textContent = text;
  statusBox.style.display = "block";

}


/* =========================================================
   HOCKMAN REAL-ESRGAN 2X
========================================================= */

const HOCKMAN_SPACE =
  "Hockman/real-esrgan-upscaler";


async function runHockmanX2(file) {

  const app =
    await Client.connect(HOCKMAN_SPACE);

  const image =
    handle_file(file);

  const job =
    app.submit(
      "/process_and_get_output",
      {
        img: image
      }
    );

  let finalData = null;

  for await (const message of job) {

    if (message.type === "status") {

      if (message.status) {

        if (message.status === "pending") {
          showStatus("Enhance AI is waiting...");
        }

        else if (message.status === "generating") {
          showStatus("AI is enhancing your photo...");
        }

        else if (message.status === "processing") {
          showStatus("Enhancing photo...");
        }

      }

    }

    if (message.type === "data") {

      finalData =
        message.data;

    }

  }

  if (!finalData || !finalData[0]) {

    throw new Error(
      "No image returned from AI"
    );

  }

  const output =
    finalData[0];

  let outputURL =
    output.url;

  if (!outputURL && output.path) {

    outputURL =
      "https://hockman-real-esrgan-upscaler.hf.space/file=" +
      encodeURIComponent(output.path);

  }

  if (!outputURL) {

    throw new Error(
      "Output image URL missing"
    );

  }

  const response =
    await fetch(outputURL);

  if (!response.ok) {

    throw new Error(
      "Could not download AI result"
    );

  }

  return await response.blob();

}


/* =========================================================
   IMAGE LOADER
========================================================= */

function loadImage(file) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      img.onload = () => {
        resolve(img);
      };

      img.onerror = reject;

      img.src =
        URL.createObjectURL(file);

    }
  );

}


/* =========================================================
   BETTER LOCAL SKIN SMOOTHING
========================================================= */

async function smoothSkin(file) {

  const img =
    await loadImage(file);

  const w =
    img.naturalWidth;

  const h =
    img.naturalHeight;


  /*
   * Main canvas
   */

  const canvas =
    document.createElement("canvas");

  canvas.width = w;
  canvas.height = h;

  const ctx =
    canvas.getContext("2d", {
      willReadFrequently: true
    });

  ctx.drawImage(
    img,
    0,
    0,
    w,
    h
  );


  /*
   * Original pixels
   */

  const original =
    ctx.getImageData(
      0,
      0,
      w,
      h
    );


  /*
   * Work canvas.
   *
   * We use a smaller working image for
   * faster mobile processing.
   */

  const maxWorkWidth = 900;

  const scale =
    Math.min(
      1,
      maxWorkWidth / w
    );

  const sw =
    Math.max(
      1,
      Math.round(w * scale)
    );

  const sh =
    Math.max(
      1,
      Math.round(h * scale)
    );


  const work =
    document.createElement("canvas");

  work.width = sw;
  work.height = sh;

  const workCtx =
    work.getContext("2d", {
      willReadFrequently: true
    });

  workCtx.drawImage(
    img,
    0,
    0,
    sw,
    sh
  );


  /*
   * Create several smoothing passes.
   */

  const smoothCanvas =
    document.createElement("canvas");

  smoothCanvas.width = sw;
  smoothCanvas.height = sh;

  const smoothCtx =
    smoothCanvas.getContext("2d");


  /*
   * First smoothing pass.
   */

  smoothCtx.filter =
    "blur(3.2px)";

  smoothCtx.drawImage(
    work,
    0,
    0
  );


  /*
   * Second very light pass.
   *
   * This makes pores/skin texture
   * softer without creating a plastic face.
   */

  const pass2 =
    document.createElement("canvas");

  pass2.width = sw;
  pass2.height = sh;

  const pass2Ctx =
    pass2.getContext("2d");

  pass2Ctx.filter =
    "blur(1.8px)";

  pass2Ctx.drawImage(
    smoothCanvas,
    0,
    0
  );


  /*
   * Put the smoothed result back onto
   * the original-size canvas.
   */

  const blurred =
    document.createElement("canvas");

  blurred.width = w;
  blurred.height = h;

  const blurredCtx =
    blurred.getContext("2d");

  blurredCtx.drawImage(
    pass2,
    0,
    0,
    w,
    h
  );


  /*
   * Face/skin mask.
   *
   * This is intentionally limited to the
   * central face area.
   */

  const mask =
    document.createElement("canvas");

  mask.width = w;
  mask.height = h;

  const maskCtx =
    mask.getContext("2d");

  const faceX =
    w * 0.50;

  const faceY =
    h * 0.47;

  const faceW =
    w * 0.43;

  const faceH =
    h * 0.52;


  /*
   * Soft elliptical face mask.
   */

  const gradient =
    maskCtx.createRadialGradient(
      faceX,
      faceY,
      faceW * 0.18,
      faceX,
      faceY,
      faceW
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  gradient.addColorStop(
    0.55,
    "rgba(255,255,255,0.92)"
  );

  gradient.addColorStop(
    0.82,
    "rgba(255,255,255,0.55)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );


  maskCtx.fillStyle =
    gradient;

  maskCtx.beginPath();

  maskCtx.ellipse(
    faceX,
    faceY,
    faceW,
    faceH,
    0,
    0,
    Math.PI * 2
  );

  maskCtx.fill();


  /*
   * Preserve eyes.
   */

  maskCtx.globalCompositeOperation =
    "destination-out";

  function cutEllipse(
    x,
    y,
    rx,
    ry
  ) {

    maskCtx.beginPath();

    maskCtx.ellipse(
      x,
      y,
      rx,
      ry,
      0,
      0,
      Math.PI * 2
    );

    maskCtx.fill();

  }


  const eyeY =
    h * 0.40;

  const eyeRX =
    w * 0.075;

  const eyeRY =
    h * 0.028;


  cutEllipse(
    w * 0.405,
    eyeY,
    eyeRX,
    eyeRY
  );

  cutEllipse(
    w * 0.595,
    eyeY,
    eyeRX,
    eyeRY
  );


  /*
   * Preserve eyebrows.
   */

  cutEllipse(
    w * 0.405,
    h * 0.355,
    w * 0.085,
    h * 0.018
  );

  cutEllipse(
    w * 0.595,
    h * 0.355,
    w * 0.085,
    h * 0.018
  );


  /*
   * Preserve mouth.
   */

  cutEllipse(
    w * 0.50,
    h * 0.625,
    w * 0.105,
    h * 0.035
  );


  /*
   * Preserve nose center/edges.
   */

  cutEllipse(
    w * 0.50,
    h * 0.51,
    w * 0.055,
    h * 0.115
  );


  /*
   * Restore normal drawing.
   */

  maskCtx.globalCompositeOperation =
    "source-over";


  /*
   * Draw the blurred skin over the
   * original image.
   */

  const maskData =
    maskCtx.getImageData(
      0,
      0,
      w,
      h
    ).data;

  const blurredData =
    blurredCtx.getImageData(
      0,
      0,
      w,
      h
    ).data;


  const result =
    ctx.createImageData(
      w,
      h
    );

  const src =
    original.data;

  const blur =
    blurredData;

  const dst =
    result.data;


  /*
   * Strong but controlled skin smoothing.
   *
   * The mask controls where smoothing happens.
   * High-contrast facial details are protected.
   */

  for (
    let i = 0;
    i < src.length;
    i += 4
  ) {

    const maskValue =
      maskData[i + 3] / 255;

    if (maskValue <= 0) {

      dst[i] =
        src[i];

      dst[i + 1] =
        src[i + 1];

      dst[i + 2] =
        src[i + 2];

      dst[i + 3] =
        255;

      continue;

    }


    const r =
      src[i];

    const g =
      src[i + 1];

    const b =
      src[i + 2];


    const br =
      blur[i];

    const bg =
      blur[i + 1];

    const bb =
      blur[i + 2];


    /*
     * Detect strong local edges.
     *
     * When the original and blurred pixels
     * differ greatly, it is probably a
     * facial feature rather than skin texture.
     */

    const difference =
      Math.abs(r - br) +
      Math.abs(g - bg) +
      Math.abs(b - bb);


    let strength =
      0.78 * maskValue;


    /*
     * Protect strong details.
     */

    if (difference > 70) {

      strength *= 0.18;

    }

    else if (difference > 45) {

      strength *= 0.38;

    }

    else if (difference > 28) {

      strength *= 0.62;

    }


    dst[i] =
      Math.round(
        r * (1 - strength) +
        br * strength
      );

    dst[i + 1] =
      Math.round(
        g * (1 - strength) +
        bg * strength
      );

    dst[i + 2] =
      Math.round(
        b * (1 - strength) +
        bb * strength
      );

    dst[i + 3] =
      255;

  }


  ctx.putImageData(
    result,
    0,
    0
  );


  /*
   * JPEG output.
   */

  return await new Promise(
    (resolve) => {

      canvas.toBlob(
        (blob) => {

          resolve(blob);

        },
        "image/jpeg",
        0.94
      );

    }
  );

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(blob) {

  editedBlob =
    blob;

  const url =
    URL.createObjectURL(blob);

  preview.src =
    url;

  preview.style.display =
    "block";

  placeholder.style.display =
    "none";

  downloadButton.style.display =
    "block";

}


/* =========================================================
   DOWNLOAD
========================================================= */

downloadButton.addEventListener(
  "click",
  () => {

    if (!editedBlob) {
      return;
    }

    const url =
      URL.createObjectURL(
        editedBlob
      );

    const a =
      document.createElement("a");

    a.href =
      url;

    a.download =
      "AI-Edited-Photo.jpg";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      () => {
        URL.revokeObjectURL(url);
      },
      1000
    );

  }
);


/* =========================================================
   TOOL BUTTONS
========================================================= */

document
  .querySelectorAll(".tool")
  .forEach(
    (tool) => {

      tool.addEventListener(
        "click",
        async () => {

          if (!selectedFile) {

            alert(
              "Please select a photo first."
            );

            return;

          }


          const type =
            tool.dataset.tool;


          document
            .querySelectorAll(".tool")
            .forEach(
              (item) => {
                item.classList.remove(
                  "active"
                );
              }
            );

          tool.classList.add(
            "active"
          );


          downloadButton.style.display =
            "none";


          try {

            /* =========================
               ENHANCE
            ========================= */

            if (type === "enhance") {

              showStatus(
                "Connecting to Enhance AI..."
              );

              const blob =
                await runHockmanX2(
                  selectedFile
                );

              showResult(
                blob
              );

              showStatus(
                "AI Enhance complete! ✨"
              );

            }


            /* =========================
               SMOOTH SKIN
            ========================= */

            else if (type === "smooth") {

              showStatus(
                "Smoothing skin texture..."
              );

              /*
               * Small delay lets the status
               * message render before CPU work.
               */

              await new Promise(
                (resolve) =>
                  setTimeout(
                    resolve,
                    80
                  )
              );


              const blob =
                await smoothSkin(
                  selectedFile
                );

              showResult(
                blob
              );

              showStatus(
                "Smooth Skin complete! ✨"
              );

            }


            /* =========================
               HAIR
            ========================= */

            else if (type === "hair") {

              showStatus(
                "Hair AI is coming next."
              );

              downloadButton.style.display =
                "none";

            }

          }

          catch (error) {

            console.error(
              error
            );

            showStatus(
              "Something went wrong. Please try again."
            );

          }

        }
      );

    }
  );

</script>

</body>
</html>
