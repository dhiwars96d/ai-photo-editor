<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Editor</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            margin-top: 20px;
            border-radius: 10px;
            display: none;
        }

        #options {
            margin-top: 15px;
        }

        .optionButton {
            margin: 4px;
            padding: 8px 14px;
            font-size: 16px;
        }

        #editButton {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 16px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>

<h1>AI Photo Editor</h1>

<p>Apni photo select karein:</p>

<input type="file" id="photoInput" accept="image/*">

<br>

<img id="preview" alt="Photo Preview">

<canvas id="workCanvas"></canvas>

<br>

<div id="options">

    <button class="optionButton" data-option="enhance">
        ✨ Enhance
    </button>

    <button class="optionButton" data-option="smooth">
        🧴 Smooth Skin
    </button>

    <button class="optionButton" data-option="smile">
        😊 Smile
    </button>

    <button class="optionButton" data-option="hair">
        💇 Hair Color
    </button>

</div>

<br>

<button id="editButton">AI Edit</button>

<p id="status"></p>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

const photoInput =
    document.getElementById("photoInput");

const preview =
    document.getElementById("preview");

const editButton =
    document.getElementById("editButton");

const status =
    document.getElementById("status");

const workCanvas =
    document.getElementById("workCanvas");

let selectedFile = null;

let selectedOption = "enhance";

let faceLandmarks = null;


/* =========================
   OPTION BUTTONS
========================= */

document.querySelectorAll(".optionButton")
.forEach(function(button) {

    button.addEventListener("click", function() {

        selectedOption =
            button.dataset.option;

        status.textContent =
            "Selected: " +
            button.textContent.trim();

    });

});


/* =========================
   FACE MESH
========================= */

const faceMesh = new FaceMesh({

    locateFile: function(file) {

        return (
            "https://cdn.jsdelivr.net/npm/" +
            "@mediapipe/face_mesh/" +
            file
        );

    }

});


faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.3,

    minTrackingConfidence: 0.3

});


faceMesh.onResults(function(results) {

    if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
    ) {

        faceLandmarks =
            results.multiFaceLandmarks[0];

        status.textContent =
            "Face detected ✅";

        console.log("Face detected");

    }

    else {

        faceLandmarks = null;

        status.textContent =
            "Face not detected ❌";

    }

});


/* =========================
   PHOTO SELECT
========================= */

photoInput.addEventListener(
    "change",
    function() {

        selectedFile =
            photoInput.files[0];

        faceLandmarks = null;

        if (!selectedFile) {
            return;
        }

        const url =
            URL.createObjectURL(
                selectedFile
            );

        preview.src = url;

        preview.style.display =
            "block";

        status.textContent =
            "Photo load ho rahi hai...";

    }
);


/* =========================
   PHOTO LOAD
========================= */

preview.addEventListener(
    "load",
    async function() {

        try {

            await faceMesh.send({
                image: preview
            });

        }

        catch(error) {

            console.error(
                "FaceMesh error:",
                error
            );

            status.textContent =
                "Face detection error";

        }

    }
);


/* =================================================
   LOCAL SMILE
================================================= */

async function makeLocalSmile() {

    if (!faceLandmarks) {

        await faceMesh.send({
            image: preview
        });

    }


    if (!faceLandmarks) {

        throw new Error(
            "Face detect nahi hua."
        );

    }


    const img =
        preview;

    const width =
        img.naturalWidth;

    const height =
        img.naturalHeight;


    if (!width || !height) {

        throw new Error(
            "Photo properly load nahi hui."
        );

    }


    /*
     * MediaPipe mouth landmarks
     *
     * 61  = left corner
     * 291 = right corner
     * 13  = upper inner lip
     * 14  = lower inner lip
     */

    const left =
        faceLandmarks[61];

    const right =
        faceLandmarks[291];

    const top =
        faceLandmarks[13];

    const bottom =
        faceLandmarks[14];


    const lx =
        left.x * width;

    const rx =
        right.x * width;

    const ly =
        left.y * height;

    const ry =
        right.y * height;

    const ty =
        top.y * height;

    const by =
        bottom.y * height;


    const leftX =
        Math.min(lx, rx);

    const rightX =
        Math.max(lx, rx);

    const mouthTop =
        Math.min(ty, by);

    const mouthBottom =
        Math.max(ty, by);


    const mouthWidth =
        rightX - leftX;

    const mouthHeight =
        Math.max(
            2,
            mouthBottom - mouthTop
        );


    const centerX =
        (leftX + rightX) / 2;

    const centerY =
        (mouthTop + mouthBottom) / 2;


    /*
     * Work on ORIGINAL resolution.
     */

    workCanvas.width =
        width;

    workCanvas.height =
        height;


    const ctx =
        workCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    const original =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    const src =
        original.data;


    const output =
        new Uint8ClampedArray(src);


    /*
     * Smile amount.
     *
     * This is deliberately moderate.
     */

    const smileAmount =
        Math.max(
            5,
            Math.min(
                14,
                mouthWidth * 0.075
            )
        );


    /*
     * Only process a compact area
     * around the mouth.
     */

    const radiusX =
        mouthWidth * 0.72;

    const radiusY =
        mouthHeight * 3.2;


    const startX =
        Math.max(
            0,
            Math.floor(
                centerX - radiusX
            )
        );

    const endX =
        Math.min(
            width,
            Math.ceil(
                centerX + radiusX
            )
        );

    const startY =
        Math.max(
            0,
            Math.floor(
                centerY - radiusY
            )
        );

    const endY =
        Math.min(
            height,
            Math.ceil(
                centerY + radiusY
            )
        );


    /*
     * Bilinear pixel sampler.
     */

    function getPixel(
        x,
        y,
        channel
    ) {

        x = Math.max(
            0,
            Math.min(
                width - 1,
                x
            )
        );

        y = Math.max(
            0,
            Math.min(
                height - 1,
                y
            )
        );


        const x0 =
            Math.floor(x);

        const y0 =
            Math.floor(y);

        const x1 =
            Math.min(
                width - 1,
                x0 + 1
            );

        const y1 =
            Math.min(
                height - 1,
                y0 + 1
            );


        const fx =
            x - x0;

        const fy =
            y - y0;


        const p00 =
            (y0 * width + x0) * 4 +
            channel;

        const p10 =
            (y0 * width + x1) * 4 +
            channel;

        const p01 =
            (y1 * width + x0) * 4 +
            channel;

        const p11 =
            (y1 * width + x1) * 4 +
            channel;


        const a =
            src[p00] * (1 - fx) +
            src[p10] * fx;

        const b =
            src[p01] * (1 - fx) +
            src[p11] * fx;


        return (
            a * (1 - fy) +
            b * fy
        );

    }


    /*
     * Main local warp.
     */

    for (
        let y = startY;
        y < endY;
        y++
    ) {

        for (
            let x = startX;
            x < endX;
            x++
        ) {

            const dx =
                (x - centerX) /
                radiusX;

            const dy =
                (y - centerY) /
                radiusY;


            const distance =
                dx * dx +
                dy * dy;


            if (distance >= 1) {
                continue;
            }


            /*
             * Soft falloff.
             */

            const falloff =
                Math.pow(
                    1 - distance,
                    2
                );


            /*
             * Horizontal position:
             *
             * -1 = left side
             *  0 = center
             * +1 = right side
             */

            const horizontal =
                (x - centerX) /
                (mouthWidth / 2);


            /*
             * Corner influence.
             *
             * Center almost unchanged.
             * Sides move upward.
             */

            let cornerInfluence =
                Math.pow(
                    Math.min(
                        1,
                        Math.abs(horizontal)
                    ),
                    2.0
                );


            /*
             * Don't warp too far
             * outside the mouth.
             */

            if (
                Math.abs(horizontal) < 0.15
            ) {

                cornerInfluence *= 0.15;

            }


            /*
             * Upward movement.
             */

            let moveUp =
                smileAmount *
                cornerInfluence *
                falloff;


            /*
             * Upper lip gets less movement.
             */

            if (
                y < centerY
            ) {

                moveUp *= 0.45;

            }


            /*
             * Small movement toward
             * mouth center.
             *
             * This avoids a sharp line.
             */

            const pull =
                horizontal *
                moveUp *
                0.035;


            const sampleX =
                x - pull;

            const sampleY =
                y + moveUp;


            const index =
                (y * width + x) * 4;


            /*
             * Smooth blend.
             */

            const blend =
                Math.min(
                    0.75,
                    falloff
                );


            for (
                let c = 0;
                c < 3;
                c++
            ) {

                const warped =
                    getPixel(
                        sampleX,
                        sampleY,
                        c
                    );


                output[index + c] =
                    src[index + c] *
                    (1 - blend) +
                    warped *
                    blend;

            }


            output[index + 3] =
                src[index + 3];

        }

    }


    const result =
        new ImageData(
            output,
            width,
            height
        );


    ctx.putImageData(
        result,
        0,
        0
    );


    /*
     * High quality JPEG.
     */

    const blob =
        await new Promise(
            function(resolve) {

                workCanvas.toBlob(
                    resolve,
                    "image/jpeg",
                    0.98
                );

            }
        );


    if (!blob) {

        throw new Error(
            "Smile result create nahi hua."
        );

    }


    return blob;

}


/* =================================================
   EDIT BUTTON
================================================= */

editButton.addEventListener(
    "click",
    async function() {

        if (!selectedFile) {

            status.textContent =
                "Pehle photo select karein.";

            return;

        }


        editButton.disabled =
            true;


        try {


            /* =========================
               LOCAL SMILE
            ========================= */

            if (
                selectedOption === "smile"
            ) {

                status.textContent =
                    "😊 Natural smile bana raha hai...";


                const smileBlob =
                    await makeLocalSmile();


                const smileURL =
                    URL.createObjectURL(
                        smileBlob
                    );


                /*
                 * Important:
                 * Don't trigger FaceMesh again
                 * on the generated image.
                 */

                preview.onload =
                    null;


                preview.src =
                    smileURL;

                preview.style.display =
                    "block";


                status.textContent =
                    "😊 Smile Edit complete!";


                editButton.disabled =
                    false;

                return;

            }


            /* =========================
               OTHER AI FEATURES
            ========================= */

            status.textContent =
                "AI photo edit kar raha hai...";


            const formData =
                new FormData();


            formData.append(
                "image",
                selectedFile
            );


            let editPrompt =
                "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";


            /* ENHANCE */

            if (
                selectedOption === "enhance"
            ) {

                editPrompt =
                    "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";

            }


            /* SMOOTH */

            else if (
                selectedOption === "smooth"
            ) {

                editPrompt =
                    "Retouch the person's facial skin professionally. Clearly smooth the skin and reduce acne, pimples, blemishes, dark spots, uneven skin texture and fine lines. Make the skin look clean, soft, fresh and naturally polished while preserving realistic skin texture. Keep the exact same person, face shape, eyes, nose, lips, hairstyle and identity unchanged. Do not change facial features. Do not make the skin plastic, blurry or overly airbrushed. Only improve the skin.";

            }


            /* HAIR */

            else if (
                selectedOption === "hair"
            ) {

                editPrompt =
                    "Keep the person's identity and face unchanged. Naturally improve and enhance the hair appearance while keeping the original hairstyle.";

            }


            formData.append(
                "prompt",
                editPrompt
            );


            const response =
                await fetch(
                    "/api/edit",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";


            if (!response.ok) {

                let message =
                    "AI editing failed";


                if (
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    const error =
                        await response.json();


                    message =
                        error.details ||
                        error.error ||
                        message;

                }

                else {

                    message =
                        await response.text();

                }


                throw new Error(
                    message
                );

            }


            const blob =
                await response.blob();


            preview.src =
                URL.createObjectURL(
                    blob
                );

            preview.style.display =
                "block";


            status.textContent =
                "AI Edit complete!";

        }

        catch(error) {

            console.error(error);

            status.textContent =
                "Error: " +
                error.message;

        }


        editButton.disabled =
            false;

    }
);

</script>

</body>
</html>
