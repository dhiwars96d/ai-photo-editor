<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #17171c;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      background: #eeeaff;
      color: #6547d9;
      padding: 7px 11px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 9px 0 22px;
      color: #777780;
      font-size: 14px;
      line-height: 1.5;
    }

    .photo-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e7e7ec;
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.05);
    }

    .photo-box {
      width: 100%;
      height: 300px;
      border-radius: 17px;
      background: #f0f1f5;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-box img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f0f1f5;
    }

    .empty-photo {
      text-align: center;
      color: #9999a2;
      font-size: 14px;
    }

    .empty-photo-title {
      color: #55555e;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .add-photo {
      width: 100%;
      margin-top: 11px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: #17171c;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-photo:active {
      transform: scale(0.99);
    }

    #fileInput {
      display: none;
    }

    .section-title {
      margin: 25px 0 11px;
      font-size: 16px;
      font-weight: 700;
    }

    .tools {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .tool {
      min-width: 0;
      height: 122px;
      padding: 12px 7px;
      border: 1px solid #e2e2e8;
      border-radius: 18px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tool:hover {
      border-color: #8d73e8;
    }

    .tool.active {
      background: #6846d9;
      border-color: #6846d9;
      color: white;
    }

    .toolIcon {
      width: 46px;
      height: 46px;
      object-fit: contain;
      display: block;
      margin-bottom: 7px;
    }

    .tool[data-tool="hair"] .toolIcon {
      width: 58px;
      height: 58px;
    }

    .tool.active .toolIcon {
      filter: brightness(0) invert(1);
    }

    .tool-name {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .apply-btn {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 16px;
      background: #6846d9;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(104,70,217,0.22);
    }

    .apply-btn:disabled {
      background: #c9c6d4;
      box-shadow: none;
      cursor: not-allowed;
    }

    .apply-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .download-btn {
      width: 100%;
      height: 50px;
      margin-top: 11px;
      border: 0;
      border-radius: 15px;
      background: #17171c;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .download-btn:active {
      transform: scale(0.99);
    }

    .status {
      width: 100%;
      min-height: 20px;
      margin-top: 13px;
      text-align: center;
      color: #777780;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
      }

      .title {
        font-size: 27px;
      }

      .photo-box {
        height: 270px;
      }

      .tool {
        height: 118px;
      }

      .toolIcon {
        width: 42px;
        height: 42px;
      }

      .tool[data-tool="hair"] .toolIcon {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="brand">AI Photo Editor</div>
      <div class="badge">AI Powered</div>
    </header>

    <h1 class="title">Make your photos better.</h1>

    <p class="subtitle">
      Choose a photo and select an AI editing tool.
    </p>

    <section class="photo-card">

      <div class="photo-box">

        <div class="empty-photo" id="emptyPhoto">
          <div class="empty-photo-title">No photo selected</div>
          <div>Choose a photo to get started</div>
        </div>

        <img id="preview" alt="Photo Preview">

      </div>

      <button class="add-photo" id="addPhotoBtn">
        + Add Photo
      </button>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
      >

    </section>

    <div class="section-title">
      Choose an edit
    </div>

    <div class="tools">

      <div class="tool active" data-tool="enhance">

        <img
          class="toolIcon"
          src="./enhance-icon.png"
          alt="Enhance"
        >

        <div class="tool-name">
          Enhance
        </div>

      </div>

      <div class="tool" data-tool="smooth">

        <img
          class="toolIcon"
          src="./smooth-icon.png"
          alt="Smooth Skin"
        >

        <div class="tool-name">
          Smooth Skin
        </div>

      </div>

      <div class="tool" data-tool="hair">

        <img
          class="toolIcon"
          src="./hair-icon.png"
          alt="Hair"
        >

        <div class="tool-name">
          Hair
        </div>

      </div>

    </div>

    <button
      class="apply-btn"
      id="applyBtn"
      disabled
    >
      ✨ Apply AI Edit
    </button>

    <button
      class="download-btn"
      id="downloadBtn"
      style="display:none;"
    >
      ⬇ Download Photo
    </button>

    <div class="status" id="status"></div>

  </div>


  <!-- Gradio Client -->
  <script type="module">

    import {
      Client,
      handle_file
    } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";


    const fileInput =
      document.getElementById("fileInput");

    const addPhotoBtn =
      document.getElementById("addPhotoBtn");

    const preview =
      document.getElementById("preview");

    const emptyPhoto =
      document.getElementById("emptyPhoto");

    const applyBtn =
      document.getElementById("applyBtn");

    const downloadBtn =
      document.getElementById("downloadBtn");

    const status =
      document.getElementById("status");

    const tools =
      document.querySelectorAll(".tool");


    let selectedTool = "enhance";
    let selectedFile = null;
    let resultURL = null;


    /*
      HOCKMAN REAL-ESRGAN
    */

    const HOCKMAN_SPACE =
      "Hockman/real-esrgan-upscaler";


    /*
      ADD PHOTO
    */

    addPhotoBtn.addEventListener(
      "click",
      function () {

        fileInput.click();

      }
    );


    /*
      PHOTO SELECT
    */

    fileInput.addEventListener(
      "change",
      function () {

        const file =
          fileInput.files[0];

        if (!file) {
          return;
        }

        selectedFile = file;

        const imageURL =
          URL.createObjectURL(file);

        preview.src = imageURL;

        preview.style.display =
          "block";

        emptyPhoto.style.display =
          "none";

        applyBtn.disabled =
          false;

        downloadBtn.style.display =
          "none";

        resultURL = null;

        status.textContent =
          "Photo ready";

      }
    );


    /*
      TOOL SELECT
    */

    tools.forEach(
      function (tool) {

        tool.addEventListener(
          "click",
          function () {

            tools.forEach(
              function (item) {

                item.classList.remove(
                  "active"
                );

              }
            );

            tool.classList.add(
              "active"
            );

            selectedTool =
              tool.dataset.tool;

            status.textContent =
              "";

          }
        );

      }
    );


    /*
      HOCKMAN X2
    */

    async function runHockmanX2(
      file
    ) {

      status.textContent =
        "Connecting to AI...";

      const app =
        await Client.connect(
          HOCKMAN_SPACE
        );


      status.textContent =
        "Uploading photo...";


      const image =
        handle_file(file);


      status.textContent =
        "Starting X2 enhancement...";


      const job =
        app.submit(
          "/process_and_get_output",
          {
            img: image
          }
        );


      let finalData = null;


      for await (
        const message of job
      ) {

        console.log(
          "HOCKMAN MESSAGE:",
          message
        );


        if (
          message.type ===
          "status"
        ) {

          const stage =
            message.stage;


          if (
            stage === "pending"
          ) {

            if (
              message.position !==
              undefined
            ) {

              status.textContent =
                "Waiting in AI queue...";

            } else {

              status.textContent =
                "Waiting for AI...";

            }

          }


          else if (
            stage === "generating"
          ) {

            status.textContent =
              "X2 enhancement processing...";

          }


          else if (
            stage === "complete"
          ) {

            status.textContent =
              "AI processing complete...";

          }


          else if (
            stage === "error"
          ) {

            throw new Error(
              message.message ||
              "Hockman processing failed."
            );

          }

        }


        if (
          message.type ===
          "data"
        ) {

          console.log(
            "HOCKMAN DATA:",
            message.data
          );

          finalData =
            message.data;

        }

      }


      if (
        !finalData ||
        !finalData[0]
      ) {

        throw new Error(
          "Hockman did not return an image."
        );

      }


      const output =
        finalData[0];


      console.log(
        "HOCKMAN OUTPUT:",
        output
      );


      let outputURL =
        output.url;


      if (
        !outputURL &&
        output.path
      ) {

        outputURL =
          "https://hockman-real-esrgan-upscaler.hf.space/file=" +
          encodeURIComponent(
            output.path
          );

      }


      if (!outputURL) {

        throw new Error(
          "Hockman output image URL not found."
        );

      }


      status.textContent =
        "Downloading X2 result...";


      const response =
        await fetch(
          outputURL
        );


      if (!response.ok) {

        throw new Error(
          "Could not download X2 result."
        );

      }


      const blob =
        await response.blob();


      return blob;

    }


    /*
      SMOOTH SKIN
      LOCAL BROWSER PROCESSING
    */

    async function smoothSkin(
      file
    ) {

      status.textContent =
        "Loading photo...";


      const image =
        new Image();


      const imageURL =
        URL.createObjectURL(file);


      image.src =
        imageURL;


      await new Promise(
        function (resolve, reject) {

          image.onload =
            resolve;

          image.onerror =
            reject;

        }
      );


      /*
        We use a canvas at the original
        image resolution.
      */

      const canvas =
        document.createElement(
          "canvas"
        );

      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      canvas.width =
        image.naturalWidth;

      canvas.height =
        image.naturalHeight;


      /*
        Draw original image.
      */

      ctx.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
        Moderate skin smoothing.
        We intentionally keep this
        relatively low to protect
        facial identity and details.
      */

      status.textContent =
        "Smoothing skin...";


      const tempCanvas =
        document.createElement(
          "canvas"
        );

      tempCanvas.width =
        canvas.width;

      tempCanvas.height =
        canvas.height;


      const tempCtx =
        tempCanvas.getContext(
          "2d"
        );


      /*
        Slight blur.
        This is NOT face regeneration.
      */

      tempCtx.filter =
        "blur(2.2px)";

      tempCtx.drawImage(
        canvas,
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
        Face area approximation.

        Instead of changing the complete
        image, we use several soft
        elliptical regions around the
        central face.

        This keeps hair/background
        mostly untouched.
      */

      const w =
        canvas.width;

      const h =
        canvas.height;


      /*
        Estimate a portrait face area
        from the visible image.

        These values intentionally cover
        a moderate central region.
      */

      const faceX =
        w * 0.50;

      const faceY =
        h * 0.47;

      const faceW =
        w * 0.40;

      const faceH =
        h * 0.48;


      /*
        Soft mask.
      */

      const maskCanvas =
        document.createElement(
          "canvas"
        );

      maskCanvas.width =
        w;

      maskCanvas.height =
        h;


      const maskCtx =
        maskCanvas.getContext(
          "2d"
        );


      const gradient =
        maskCtx.createRadialGradient(
          faceX,
          faceY,
          faceW * 0.15,
          faceX,
          faceY,
          faceW * 0.72
        );


      gradient.addColorStop(
        0,
        "rgba(255,255,255,0.72)"
      );

      gradient.addColorStop(
        0.55,
        "rgba(255,255,255,0.52)"
      );

      gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );


      maskCtx.fillStyle =
        gradient;


      maskCtx.beginPath();

      maskCtx.ellipse(
        faceX,
        faceY,
        faceW / 2,
        faceH / 2,
        0,
        0,
        Math.PI * 2
      );

      maskCtx.fill();


      /*
        Remove eye areas.
      */

      maskCtx.globalCompositeOperation =
        "destination-out";


      function cutEllipse(
        x,
        y,
        rx,
        ry
      ) {

        maskCtx.beginPath();

        maskCtx.ellipse(
          x,
          y,
          rx,
          ry,
          0,
          0,
          Math.PI * 2
        );

        maskCtx.fill();

      }


      cutEllipse(
        w * 0.42,
        h * 0.40,
        w * 0.075,
        h * 0.035
      );


      cutEllipse(
        w * 0.58,
        h * 0.40,
        w * 0.075,
        h * 0.035
      );


      /*
        Remove mouth area.
      */

      cutEllipse(
        w * 0.50,
        h * 0.59,
        w * 0.10,
        h * 0.045
      );


      /*
        Remove nose center slightly.
        This protects facial structure.
      */

      cutEllipse(
        w * 0.50,
        h * 0.49,
        w * 0.045,
        h * 0.075
      );


      /*
        Apply blurred image with mask.
      */

      ctx.save();

      ctx.globalCompositeOperation =
        "source-over";


      const oldImage =
        document.createElement(
          "canvas"
        );

      oldImage.width =
        w;

      oldImage.height =
        h;


      oldImage
        .getContext("2d")
        .drawImage(
          canvas,
          0,
          0
        );


      /*
        Put blurred image into
        a separate layer.
      */

      const smoothLayer =
        document.createElement(
          "canvas"
        );

      smoothLayer.width =
        w;

      smoothLayer.height =
        h;


      const smoothCtx =
        smoothLayer.getContext(
          "2d"
        );


      smoothCtx.drawImage(
        tempCanvas,
        0,
        0
      );


      /*
        Apply mask to smooth layer.
      */

      smoothCtx.globalCompositeOperation =
        "destination-in";


      smoothCtx.drawImage(
        maskCanvas,
        0,
        0
      );


      /*
        Blend smooth layer over
        original image.
      */

      ctx.globalAlpha =
        0.48;


      ctx.drawImage(
        smoothLayer,
        0,
        0
      );


      ctx.restore();


      /*
        Convert result to JPEG.
      */

      status.textContent =
        "Preparing result...";


      const blob =
        await new Promise(
          function (resolve) {

            canvas.toBlob(
              resolve,
              "image/jpeg",
              0.94
            );

          }
        );


      URL.revokeObjectURL(
        imageURL
      );


      if (!blob) {

        throw new Error(
          "Smooth Skin result could not be created."
        );

      }


      return blob;

    }


    /*
      AI EDIT
    */

    applyBtn.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {

          status.textContent =
            "Please select a photo first.";

          return;

        }


        applyBtn.disabled =
          true;

        downloadBtn.style.display =
          "none";


        try {


          /*
            ENHANCE
          */

          if (
            selectedTool ===
            "enhance"
          ) {

            const resultBlob =
              await runHockmanX2(
                selectedFile
              );


            resultURL =
              URL.createObjectURL(
                resultBlob
              );


            preview.src =
              resultURL;

            preview.style.display =
              "block";

            emptyPhoto.style.display =
              "none";


            status.textContent =
              "AI Edit complete!";


            downloadBtn.style.display =
              "block";

          }


          /*
            SMOOTH SKIN
          */

          else if (
            selectedTool ===
            "smooth"
          ) {

            const resultBlob =
              await smoothSkin(
                selectedFile
              );


            resultURL =
              URL.createObjectURL(
                resultBlob
              );


            preview.src =
              resultURL;

            preview.style.display =
              "block";

            emptyPhoto.style.display =
              "none";


            status.textContent =
              "Smooth Skin complete!";


            downloadBtn.style.display =
              "block";

          }


          /*
            HAIR
          */

          else if (
            selectedTool ===
            "hair"
          ) {

            status.textContent =
              "Hair AI is coming next.";

          }


        }


        catch (error) {

          console.error(
            "AI EDIT ERROR:",
            error
          );


          status.textContent =
            error.message ||
            "AI edit failed.";


          downloadBtn.style.display =
            "none";

        }


        finally {

          applyBtn.disabled =
            false;

        }

      }
    );


    /*
      DOWNLOAD
    */

    downloadBtn.addEventListener(
      "click",
      function () {

        if (!resultURL) {
          return;
        }


        const link =
          document.createElement(
            "a"
          );


        link.href =
          resultURL;


        link.download =
          "AI-Edited-Photo.jpg";


        document.body.appendChild(
          link
        );


        link.click();


        document.body.removeChild(
          link
        );

      }
    );

  </script>

</body>
</html>
