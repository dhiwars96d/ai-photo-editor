<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Photo Editor</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    margin-bottom: 10px;
}

#photoInput {
    margin: 15px 0;
}

#preview {
    max-width: 100%;
    max-height: 500px;
    display: none;
    margin: 15px auto;
    border-radius: 10px;
}

#workCanvas,
#maskCanvas {
    display: none;
}

.optionButton {
    padding: 10px 14px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #ddd;
    font-size: 15px;
}

.optionButton.selected {
    background: #222;
    color: white;
}

#editButton {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    font-size: 17px;
}

#status {
    margin-top: 15px;
    font-size: 15px;
}
</style>
</head>

<body>

<h1>AI Photo Editor</h1>

<p>Apni photo select karein:</p>

<input type="file" id="photoInput" accept="image/*">

<img id="preview" alt="Photo Preview">

<canvas id="workCanvas"></canvas>
<canvas id="maskCanvas"></canvas>

<div id="options">

<button class="optionButton selected" data-option="enhance">
✨ Enhance
</button>

<button class="optionButton" data-option="smooth">
🧴 Smooth Skin
</button>

<button class="optionButton" data-option="smile">
😊 Smile
</button>

<button class="optionButton" data-option="hair">
💇 Hair Color
</button>

</div>

<button id="editButton">
AI Edit
</button>

<p id="status"></p>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

const photoInput =
    document.getElementById("photoInput");

const preview =
    document.getElementById("preview");

const workCanvas =
    document.getElementById("workCanvas");

const editButton =
    document.getElementById("editButton");

const status =
    document.getElementById("status");


let selectedFile = null;

let selectedOption = "enhance";

let faceLandmarks = null;

let faceReady = false;


/* =========================
   OPTION BUTTONS
========================= */

document.querySelectorAll(".optionButton")
.forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".optionButton")
        .forEach(b => {
            b.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedOption =
            button.dataset.option;

        status.innerText =
            "Selected: " + selectedOption;

    });

});


/* =========================
   PHOTO SELECT
========================= */

photoInput.addEventListener("change", () => {

    if (!photoInput.files ||
        !photoInput.files[0]) {
        return;
    }

    selectedFile =
        photoInput.files[0];

    const url =
        URL.createObjectURL(selectedFile);

    preview.src = url;

    preview.style.display = "block";

    faceReady = false;

    faceLandmarks = null;

    status.innerText =
        "Photo load ho rahi hai...";

});


/* =========================
   MEDIAPIPE
========================= */

const faceMesh = new FaceMesh({

    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }

});
faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.3,

    minTrackingConfidence: 0.3

});


faceMesh.onResults((results) => {

    if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
    ) {

        faceLandmarks =
            results.multiFaceLandmarks[0];

        faceReady = true;

        status.innerText =
            "Face detected ✓";

    } else {

        faceLandmarks = null;

        faceReady = false;

        status.innerText =
            "Face not detected";

    }

});


preview.addEventListener("load", async () => {

    if (!preview.src) return;

    try {

        await faceMesh.send({
            image: preview
        });

    } catch (error) {

        console.log(error);

        faceReady = false;

        status.innerText =
            "Face detection error";

    }

});


/* =========================
   LANDMARK POINT
========================= */

function getPoint(index) {

    const p =
        faceLandmarks[index];

    return {

        x: p.x * workCanvas.width,

        y: p.y * workCanvas.height

    };

}


/* =========================
   AFFINE TRIANGLE
========================= */

function drawTriangle(
    ctx,
    image,
    s0,
    s1,
    s2,
    d0,
    d1,
    d2
) {

    const x0 = s0.x;
    const y0 = s0.y;

    const x1 = s1.x;
    const y1 = s1.y;

    const x2 = s2.x;
    const y2 = s2.y;

    const X0 = d0.x;
    const Y0 = d0.y;

    const X1 = d1.x;
    const Y1 = d1.y;

    const X2 = d2.x;
    const Y2 = d2.y;


    const det =
        (x1 - x0) * (y2 - y0) -
        (x2 - x0) * (y1 - y0);


    if (Math.abs(det) < 0.001) {
        return;
    }


    const a =
        ((X1 - X0) * (y2 - y0) -
        (X2 - X0) * (y1 - y0)) / det;

    const c =
        ((X2 - X0) * (x1 - x0) -
        (X1 - X0) * (x2 - x0)) / det;

    const b =
        ((Y1 - Y0) * (y2 - y0) -
        (Y2 - Y0) * (y1 - y0)) / det;

    const d =
        ((Y2 - Y0) * (x1 - x0) -
        (Y1 - Y0) * (x2 - x0)) / det;


    const e =
        X0 - a * x0 - c * y0;

    const f =
        Y0 - b * x0 - d * y0;


    ctx.save();

    ctx.beginPath();

    ctx.moveTo(X0, Y0);

    ctx.lineTo(X1, Y1);

    ctx.lineTo(X2, Y2);

    ctx.closePath();

    ctx.clip();


    ctx.setTransform(
        a,
        b,
        c,
        d,
        e,
        f
    );


    ctx.drawImage(
        image,
        0,
        0
    );


    ctx.restore();

}


/* =========================
   SMOOTH SMILE MESH
========================= */

function createSmile() {

    if (!faceReady ||
        !faceLandmarks) {

        status.innerText =
            "Face detect nahi hua.";

        return null;
    }


    const width =
        preview.naturalWidth;

    const height =
        preview.naturalHeight;


    workCanvas.width =
        width;

    workCanvas.height =
        height;


    const ctx =
        workCanvas.getContext("2d");


    /*
       Original photo
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.drawImage(
        preview,
        0,
        0,
        width,
        height
    );


    /*
       Mouth contour.

       Ye points mouth ke
       outer boundary ko follow
       karte hain.
    */

    const ids = [
        61,
        185,
        40,
        39,
        37,
        0,
        267,
        269,
        270,
        409,
        291,
        375,
        321,
        405,
        314,
        17,
        84,
        181,
        91,
        146
    ];


    const source = [];


    ids.forEach(id => {

        source.push(
            getPoint(id)
        );

    });


    /*
       Mouth center.
    */

    const centerSource =
        getPoint(13);


    /*
       Copy destination points.
    */

    const dest =
        source.map(p => ({
            x: p.x,
            y: p.y
        }));


    /*
       Mouth width.
    */

    const left =
        source[0];

    const right =
        source[10];


    const mouthWidth =
        Math.abs(
            right.x - left.x
        );


    /*
       Very small movement.

       Purpose:
       Natural smile,
       not artificial grin.
    */

    const smile =
        Math.max(
            2,
            Math.min(
                7,
                mouthWidth * 0.035
            )
        );


    /*
       Move LEFT corner upward.
    */

    dest[0].y -= smile;


    /*
       Nearby left points
       move progressively.
    */

    dest[1].y -= smile * 0.75;

    dest[2].y -= smile * 0.50;

    dest[3].y -= smile * 0.30;


    /*
       Move RIGHT corner upward.
    */

    dest[10].y -= smile;


    dest[9].y -= smile * 0.75;

    dest[8].y -= smile * 0.50;

    dest[7].y -= smile * 0.30;


    /*
       Lower lip middle moves
       only very slightly upward.
    */

    dest[15].y -= smile * 0.15;

    dest[16].y -= smile * 0.10;


    /*
       Center destination.
       Keep center almost fixed.
    */

    const centerDest = {

        x: centerSource.x,

        y: centerSource.y

    };


    /*
       Triangle fan.

       Every triangle shares
       only the center point.

       No overlapping triangles.
    */

    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const next =
            (i + 1) %
            source.length;


        drawTriangle(
            ctx,
            preview,

            source[i],
            source[next],
            centerSource,

            dest[i],
            dest[next],
            centerDest
        );

    }


    /*
       Final image.

       Keep the mouth edit subtle.
    */

    const finalCanvas =
        document.createElement("canvas");

    finalCanvas.width =
        width;

    finalCanvas.height =
        height;


    const finalCtx =
        finalCanvas.getContext("2d");


    /*
       Original image first.
    */

    finalCtx.drawImage(
        preview,
        0,
        0,
        width,
        height
    );


    /*
       Soft mouth ellipse.
    */

    const mouthCenterX =
        (left.x + right.x) / 2;

    const mouthCenterY =
        (source[5].y +
         source[15].y) / 2;


    const radiusX =
        mouthWidth * 0.58;


    const radiusY =
        Math.max(
            25,
            mouthWidth * 0.20
        );


    finalCtx.save();


    finalCtx.beginPath();


    finalCtx.ellipse(
        mouthCenterX,
        mouthCenterY,
        radiusX,
        radiusY,
        0,
        0,
        Math.PI * 2
    );


    finalCtx.clip();


    finalCtx.drawImage(
        workCanvas,
        0,
        0
    );


    finalCtx.restore();


    return finalCanvas;

}


/* =========================
   AI EDIT
========================= */

editButton.addEventListener(
"click",
async () => {


    if (!selectedFile) {

        status.innerText =
            "Pehle photo select karein.";

        return;

    }


    /*
       SMILE
       Completely local.
    */

    if (
        selectedOption === "smile"
    ) {

        status.innerText =
            "Natural smile bana raha hoon...";


        const resultCanvas =
            createSmile();


        if (!resultCanvas) {
            return;
        }


        resultCanvas.toBlob(
        (blob) => {

            if (!blob) {

                status.innerText =
                    "Smile edit failed.";

                return;

            }


            const resultURL =
                URL.createObjectURL(
                    blob
                );


            /*
               MediaPipe ko result
               par dobara mat chalana.
            */

            preview.onload = null;

            preview.src =
                resultURL;

            preview.style.display =
                "block";


            status.innerText =
                "Smile edit complete ✓";

        },
        "image/jpeg",
        0.98
        );


        return;

    }


    /*
       OTHER AI FEATURES
    */

    status.innerText =
        "AI photo edit kar raha hai...";


    try {

        const formData =
            new FormData();


        formData.append(
            "image",
            selectedFile
        );


        let prompt = "";


        if (
            selectedOption ===
            "enhance"
        ) {

            prompt =
            "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";

        }


        if (
            selectedOption ===
            "smooth"
        ) {

            prompt =
            "Retouch the person's facial skin professionally. Clearly smooth the skin and reduce acne, pimples, blemishes, dark spots, uneven skin texture and fine lines. Make the skin look clean, soft, fresh and naturally polished while preserving realistic skin texture. Keep the exact same person, face shape, eyes, nose, lips, hairstyle and identity unchanged. Do not change facial features. Do not make the skin plastic, blurry or overly airbrushed. Only improve the skin.";

        }


        if (
            selectedOption ===
            "hair"
        ) {

            prompt =
            "Keep the person's identity and face unchanged. Naturally improve and enhance the hair appearance while keeping the original hairstyle.";

        }


        formData.append(
            "prompt",
            prompt
        );


        const response =
            await fetch(
                "/api/edit",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {

            throw new Error(
                "AI edit failed"
            );

        }


        const blob =
            await response.blob();


        const resultURL =
            URL.createObjectURL(
                blob
            );


        preview.onload = null;

        preview.src =
            resultURL;


        preview.style.display =
            "block";


        status.innerText =
            "AI Edit complete ✓";


    } catch (error) {

        console.log(error);

        status.innerText =
            "AI Edit failed.";

    }

});

</script>

</body>
</html>
