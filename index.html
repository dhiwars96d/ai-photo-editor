<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Photo Editor</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    margin-bottom: 10px;
}

#photoInput {
    margin: 15px 0;
}

#preview {
    max-width: 100%;
    max-height: 500px;
    display: none;
    margin: 15px auto;
    border-radius: 10px;
}

#workCanvas {
    display: none;
}

#maskCanvas {
    display: none;
}

#options {
    margin-top: 15px;
}

.optionButton {
    padding: 10px 14px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #ddd;
    font-size: 15px;
}

.optionButton.selected {
    background: #222;
    color: white;
}

#editButton {
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    font-size: 17px;
}

#status {
    margin-top: 15px;
    font-size: 15px;
}
</style>
</head>

<body>

<h1>AI Photo Editor</h1>

<p>Apni photo select karein:</p>

<input type="file" id="photoInput" accept="image/*">

<img id="preview" alt="Photo Preview">

<canvas id="workCanvas"></canvas>
<canvas id="maskCanvas"></canvas>

<div id="options">

    <button class="optionButton selected" data-option="enhance">
        ✨ Enhance
    </button>

    <button class="optionButton" data-option="smooth">
        🧴 Smooth Skin
    </button>

    <button class="optionButton" data-option="smile">
        😊 Smile
    </button>

    <button class="optionButton" data-option="hair">
        💇 Hair Color
    </button>

</div>

<button id="editButton">
    AI Edit
</button>

<p id="status"></p>


<!-- MediaPipe FaceMesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>


<script>

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const workCanvas = document.getElementById("workCanvas");
const maskCanvas = document.getElementById("maskCanvas");
const editButton = document.getElementById("editButton");
const status = document.getElementById("status");

let selectedFile = null;
let selectedOption = "enhance";

let faceLandmarks = null;
let faceReady = false;


/* =========================
   OPTION BUTTONS
========================= */

document.querySelectorAll(".optionButton").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".optionButton")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        selectedOption = button.dataset.option;

        status.innerText =
            "Selected: " + selectedOption;

    });

});


/* =========================
   PHOTO SELECT
========================= */

photoInput.addEventListener("change", () => {

    if (!photoInput.files || !photoInput.files[0]) {
        return;
    }

    selectedFile = photoInput.files[0];

    const url = URL.createObjectURL(selectedFile);

    preview.src = url;

    preview.style.display = "block";

    faceLandmarks = null;
    faceReady = false;

    status.innerText = "Photo load ho rahi hai...";

});


/* =========================
   MEDIAPIPE
========================= */

const faceMesh = new FaceMesh({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;

    }

});


faceMesh.setOptions({

    maxNumFaces: 1,

    refineLandmarks: true,

    minDetectionConfidence: 0.3,

    minTrackingConfidence: 0.3

});


faceMesh.onResults((results) => {

    if (
        results.multiFaceLandmarks &&
        results.multiFaceLandmarks.length > 0
    ) {

        faceLandmarks =
            results.multiFaceLandmarks[0];

        faceReady = true;

        status.innerText = "Face detected ✓";

    } else {

        faceLandmarks = null;

        faceReady = false;

        status.innerText = "Face not detected";

    }

});


preview.addEventListener("load", async () => {

    if (!preview.src) return;

    try {

        await faceMesh.send({
            image: preview
        });

    } catch (error) {

        console.log(error);

        faceReady = false;

        status.innerText =
            "Face detection error";

    }

});


/* =========================
   HELPER
========================= */

function point(index) {

    const p = faceLandmarks[index];

    return {

        x: p.x * workCanvas.width,

        y: p.y * workCanvas.height

    };

}


/* =========================
   TRIANGLE WARP
========================= */

function warpTriangle(
    ctx,
    source,
    s0,
    s1,
    s2,
    d0,
    d1,
    d2
) {

    const sx0 = s0.x;
    const sy0 = s0.y;

    const sx1 = s1.x;
    const sy1 = s1.y;

    const sx2 = s2.x;
    const sy2 = s2.y;

    const dx0 = d0.x;
    const dy0 = d0.y;

    const dx1 = d1.x;
    const dy1 = d1.y;

    const dx2 = d2.x;
    const dy2 = d2.y;


    const denom =
        sx0 * (sy1 - sy2) +
        sx1 * (sy2 - sy0) +
        sx2 * (sy0 - sy1);


    if (Math.abs(denom) < 0.0001) {
        return;
    }


    const a =
        (
            dx0 * (sy1 - sy2) +
            dx1 * (sy2 - sy0) +
            dx2 * (sy0 - sy1)
        ) / denom;


    const b =
        (
            dy0 * (sy1 - sy2) +
            dy1 * (sy2 - sy0) +
            dy2 * (sy0 - sy1)
        ) / denom;


    const c =
        (
            dx0 * (sx2 * sy1 - sx1 * sy2) +
            dx1 * (sx0 * sy2 - sx2 * sy0) +
            dx2 * (sx1 * sy0 - sx0 * sy1)
        ) / denom;


    const d =
        (
            dx0 * (sx1 - sx2) +
            dx1 * (sx2 - sx0) +
            dx2 * (sx0 - sx1)
        ) / denom;


    const e =
        (
            dy0 * (sx1 - sx2) +
            dy1 * (sx2 - sx0) +
            dy2 * (sx0 - sx1)
        ) / denom;


    const f =
        (
            dy0 * (sx2 * sy1 - sx1 * sy2) +
            dy1 * (sx0 * sy2 - sx2 * sy0) +
            dy2 * (sx1 * sy0 - sx0 * sy1)
        ) / denom;


    ctx.save();

    ctx.beginPath();

    ctx.moveTo(dx0, dy0);

    ctx.lineTo(dx1, dy1);

    ctx.lineTo(dx2, dy2);

    ctx.closePath();

    ctx.clip();


    ctx.setTransform(
        a,
        b,
        d,
        e,
        c,
        f
    );


    ctx.drawImage(source, 0, 0);

    ctx.restore();

}


/* =========================
   LOCAL SMILE MESH
========================= */

function createSmile() {

    if (!faceReady || !faceLandmarks) {

        status.innerText =
            "Face detect nahi hua.";

        return null;

    }


    const width = preview.naturalWidth;
    const height = preview.naturalHeight;


    workCanvas.width = width;
    workCanvas.height = height;


    const ctx = workCanvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* Original image */

    ctx.drawImage(
        preview,
        0,
        0,
        width,
        height
    );


    /*
       Important mouth landmarks
    */

    const L = point(61);
    const R = point(291);

    const U = point(13);
    const D = point(14);


    /*
       Support points around mouth
       These keep nearby skin stable.
    */

    const UL = point(78);
    const UR = point(308);

    const LL = point(95);
    const LR = point(324);

    const CL = point(57);
    const CR = point(287);


    /*
       Original points
    */

    const source = {

        L: {...L},
        R: {...R},

        U: {...U},
        D: {...D},

        UL: {...UL},
        UR: {...UR},

        LL: {...LL},
        LR: {...LR},

        CL: {...CL},
        CR: {...CR}

    };


    /*
       Smile amount

       Small movement is intentional.
       Large movement causes distortion.
    */

    const mouthWidth =
        Math.abs(R.x - L.x);


    const smileAmount =
        Math.max(
            3,
            Math.min(
                9,
                mouthWidth * 0.045
            )
        );


    /*
       Destination points

       Mouth corners go slightly upward.
    */

    const dest = {

        L: {
            x: L.x,
            y: L.y - smileAmount
        },

        R: {
            x: R.x,
            y: R.y - smileAmount
        },

        U: {
            x: U.x,
            y: U.y
        },

        D: {
            x: D.x,
            y: D.y + smileAmount * 0.25
        },

        UL: {...UL},
        UR: {...UR},

        LL: {...LL},
        LR: {...LR},

        CL: {...CL},
        CR: {...CR}

    };


    /*
       Slightly raise the outer
       mouth support points.
    */

    dest.UL.y -= smileAmount * 0.35;
    dest.UR.y -= smileAmount * 0.35;

    dest.LL.y -= smileAmount * 0.25;
    dest.LR.y -= smileAmount * 0.25;


    /*
       Create triangles.

       Each triangle is independently
       transformed so there is no
       large pixel displacement.
    */

    warpTriangle(
        ctx,
        preview,
        source.UL,
        source.L,
        source.U,
        dest.UL,
        dest.L,
        dest.U
    );


    warpTriangle(
        ctx,
        preview,
        source.L,
        source.CL,
        source.D,
        dest.L,
        dest.CL,
        dest.D
    );


    warpTriangle(
        ctx,
        preview,
        source.CL,
        source.LL,
        source.D,
        dest.CL,
        dest.LL,
        dest.D
    );


    warpTriangle(
        ctx,
        preview,
        source.L,
        source.U,
        source.R,
        dest.L,
        dest.U,
        dest.R
    );


    warpTriangle(
        ctx,
        preview,
        source.R,
        source.U,
        source.UR,
        dest.R,
        dest.U,
        dest.UR
    );


    warpTriangle(
        ctx,
        preview,
        source.R,
        source.D,
        source.CR,
        dest.R,
        dest.D,
        dest.CR
    );


    warpTriangle(
        ctx,
        preview,
        source.CR,
        source.D,
        source.LR,
        dest.CR,
        dest.D,
        dest.LR
    );


    /*
       Restore outside mouth area
       from original image.

       This helps keep the
       face identity stable.
    */


    const finalCanvas =
        document.createElement("canvas");

    finalCanvas.width = width;
    finalCanvas.height = height;

    const finalCtx =
        finalCanvas.getContext("2d");

    finalCtx.drawImage(
        preview,
        0,
        0,
        width,
        height
    );


    /*
       Soft mouth region.
    */

    const centerX =
        (L.x + R.x) / 2;

    const centerY =
        (U.y + D.y) / 2;


    const radiusX =
        mouthWidth * 0.72;

    const radiusY =
        Math.max(
            35,
            Math.abs(D.y - U.y) * 5
        );


    /*
       Use destination warped canvas
       only inside mouth area.
    */

    finalCtx.save();

    finalCtx.beginPath();

    finalCtx.ellipse(
        centerX,
        centerY,
        radiusX,
        radiusY,
        0,
        0,
        Math.PI * 2
    );

    finalCtx.clip();

    finalCtx.drawImage(
        workCanvas,
        0,
        0
    );

    finalCtx.restore();


    /*
       Return final canvas
    */

    return finalCanvas;

}


/* =========================
   AI EDIT BUTTON
========================= */

editButton.addEventListener("click", async () => {

    if (!selectedFile) {

        status.innerText =
            "Pehle photo select karein.";

        return;

    }


    /* =====================
       LOCAL SMILE
    ===================== */

    if (selectedOption === "smile") {

        status.innerText =
            "Natural smile bana raha hoon...";


        const resultCanvas =
            createSmile();


        if (!resultCanvas) {
            return;
        }


        resultCanvas.toBlob(
            (blob) => {

                if (!blob) {

                    status.innerText =
                        "Smile edit failed.";

                    return;

                }


                const resultURL =
                    URL.createObjectURL(blob);


                /*
                   Important:
                   MediaPipe ko result image
                   par dobara run nahi karna.
                */

                preview.onload = null;

                preview.src = resultURL;

                preview.style.display =
                    "block";


                status.innerText =
                    "Smile edit complete ✓";

            },
            "image/jpeg",
            0.95
        );


        return;

    }


    /* =====================
       AI FEATURES
    ===================== */

    status.innerText =
        "AI photo edit kar raha hai...";


    try {

        const formData =
            new FormData();


        formData.append(
            "image",
            selectedFile
        );


        let prompt = "";


        if (selectedOption === "enhance") {

            prompt =
                "Enhance this photo naturally. Improve image quality, lighting, sharpness and facial details. Keep the person's identity and face unchanged.";

        }


        if (selectedOption === "smooth") {

            prompt =
                "Retouch the person's facial skin professionally. Clearly smooth the skin and reduce acne, pimples, blemishes, dark spots, uneven skin texture and fine lines. Make the skin look clean, soft, fresh and naturally polished while preserving realistic skin texture. Keep the exact same person, face shape, eyes, nose, lips, hairstyle and identity unchanged. Do not change facial features. Do not make the skin plastic, blurry or overly airbrushed. Only improve the skin.";

        }


        if (selectedOption === "hair") {

            prompt =
                "Keep the person's identity and face unchanged. Naturally improve and enhance the hair appearance while keeping the original hairstyle.";

        }


        formData.append(
            "prompt",
            prompt
        );


        const response =
            await fetch(
                "/api/edit",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            console.log(errorText);

            throw new Error(
                "AI edit failed"
            );

        }


        const blob =
            await response.blob();


        const resultURL =
            URL.createObjectURL(blob);


        /*
           Prevent FaceMesh from
           processing AI result.
        */

        preview.onload = null;

        preview.src =
            resultURL;


        preview.style.display =
            "block";


        status.innerText =
            "AI Edit complete ✓";


    } catch (error) {

        console.log(error);

        status.innerText =
            "AI Edit failed.";

    }

});

</script>

</body>
</html>
